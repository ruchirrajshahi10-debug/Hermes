H.actions['add-fac'] = () => { const ctx = H.context(); const t = ctx.trip; const city = H.param.careCity || (ctx.stop ? ctx.stop.city : t ? t.stops[0].city : ctx.city); H.modal(`<div class="modal-head"><h2>Add a facility you verified</h2><button class="iconbtn" data-act="close">${H.icon('x')}</button></div><form data-form="fac"><div class="grid g2">${H.c.field('name', 'Name', '', 'text', 'required')}${H.c.select('type', 'Type', ['Hospital', 'Emergency department', 'Clinic', 'Urgent care', 'Pharmacy', 'Specialist', 'Laboratory', 'Telemedicine'], 'Hospital')}${H.c.field('city', 'City', city, 'text', 'required')}${H.c.field('phone', 'Phone', '', 'tel')}${H.c.field('hours', 'Hours (as verified)', '')}${H.c.field('langs', 'Languages', '')}</div>${H.c.field('address', 'Address', '')}<label class="f"><span>Capabilities</span></label><div class="pills" style="margin-bottom:12px">${['emergency', 'general', 'diabetes', 'cardiology', 'allergy', 'altitude', 'pharmacy'].map(c => `<label class="pill"><input type="checkbox" name="cap_${c}" style="margin-right:6px">${c}</label>`).join('')}</div><button class="btn">Save facility</button></form>`); };
H.forms.fac = f => { const ctx = H.context(); const ci = Object.values(H.COUNTRIES).map(c => c.cities[f.city]).find(Boolean); const country = (Object.entries(H.COUNTRIES).find(([n, c]) => c.cities[f.city]) || [ctx.country])[0]; H.state.facilities.push({ id: H.uid('f'), name: f.name, type: f.type, city: f.city, country, lat: null, lng: null, caps: ['emergency', 'general', 'diabetes', 'cardiology', 'allergy', 'altitude', 'pharmacy'].filter(c => f['cap_' + c]), langs: f.langs ? f.langs.split(',').map(x => x.trim()) : [], hours: f.hours, phone: f.phone, address: f.address, source: 'user', saved: true }); H.save(); H.closeModal(); H.toast('Facility saved — available offline'); H.render(); };

</script>
<script>
/* Health: hub, conditions, medication management + travel planner, allergies + exposure flow, tracking, symptoms, wellness */
'use strict';
H.views.health = () => {
  const S = H.state; const now = H.now(); const ctx = H.context(); const today = H.parts(now, ctx.tz).date;
  const R = k => H.visible(S.readings).filter(r => r.type === k).sort((a, b) => new Date(a.at) - new Date(b.at)).slice(-14);
  const vit = [['bp', 'Blood pressure', 'mmHg', '#1E88E5', [80, 120]], ['glucose', 'Glucose', 'mg/dL', '#0F9484', [70, 130]], ['spo2', 'SpO₂', '%', '#1E88E5', [95, 100]], ['hr', 'Heart rate', 'bpm', '#0F9484', [60, 100]], ['weight', 'Weight', 'kg', '#7C6AE6', null]].filter(v => S.monitoring[v[0]] || R(v[0]).length);
  const taken = S.medLogs.filter(l => l.status === 'taken' && H.parts(new Date(l.dueAt), ctx.tz).date === today).length; let dueToday = 0; S.meds.forEach(m => dueToday += H.med.schedule(m, H.zoned(today, '00:00', ctx.tz), H.zoned(today, '23:59', ctx.tz)).length);
  const openSym = S.symptoms.filter(s => !s.resolved).length; const mood = S.moods[S.moods.length - 1];
  const tile = (href, cls, icon, title, value, sub, extra) => `<a class="mini" href="#${href}"><div class="row" style="flex-wrap:nowrap;gap:10px"><span class="q ${cls}" style="width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center">${H.icon(icon)}</span><div style="min-width:0"><div class="k">${title}</div><div class="v" style="font-size:18px">${value}</div></div></div>${sub ? `<div class="f" style="margin-top:6px">${sub}</div>` : ''}${extra || ''}</a>`;
  return `<div class="row between" style="margin:6px 0 4px"><h1>Health</h1><button class="btn sm" data-act="add-reading">${H.icon('plus')}Log</button></div>
   <div class="card" style="background:linear-gradient(135deg,#0B1D33,#164E8A);color:#fff"><div class="row" style="flex-wrap:nowrap;gap:16px">${H.g.ring(dueToday ? taken / dueToday : 1, { size: 84, stroke: 9, color: '#2DD4BF', track: 'rgba(255,255,255,.15)', center: `${taken}/${dueToday}`, ink: '#fff', fs: 16 })}<div><div class="small" style="opacity:.8;font-weight:600">TODAY'S DOSES</div><div style="font-family:var(--display);font-size:20px;font-weight:800">${dueToday ? (taken >= dueToday ? 'All taken ✓' : `${dueToday - taken} to go`) : 'No scheduled doses'}</div><a class="btn sm" href="#meds" style="margin-top:8px;background:#fff;color:var(--navy)">Medication & time zones</a></div></div></div>
   ${vit.length ? `<div class="section"><div class="sec-h"><span>Vitals</span><a href="#track">All trends</a></div><div class="duo">${vit.map(([k, l, u, c, ref]) => { const rr = R(k); const r = rr[rr.length - 1]; const lv = r ? H.readingLevel(r) : 'ok'; return `<a class="mini" href="#track"><div class="k">${l}${lv !== 'ok' ? `<span class="badge ${lv}" style="font-size:10px">${lv}</span>` : ''}</div><div class="v mono">${r ? H.fmtReading(r) : '—'} <small>${u}</small></div><div class="f">normal ${H.REF[k].normal.split(' (')[0].split(';')[0]}</div>${H.g.spark(rr.map(x => x.v1), c, ref)}</a>`; }).join('')}</div></div>` : ''}
   <div class="section"><div class="sec-h"><span>Your care</span></div><div class="duo">
    ${tile('symptoms', 'coral', 'alert', 'Symptoms', openSym ? openSym + ' open' : 'None', 'Log & get guidance')}
    ${tile('allergy', 'amber', 'shield', 'Allergies', S.allergies.length || 'None', S.allergies.map(a => a.allergen.split(' (')[0]).join(', ').slice(0, 34) || 'Add allergies')}
    ${tile('wellness', 'violet', 'bed', 'Recharge', (S.sleepLogs.filter(l => l.date <= today).sort((a, b) => a.date < b.date ? 1 : -1)[0] || {}).hours ? (S.sleepLogs.filter(l => l.date <= today).sort((a, b) => a.date < b.date ? 1 : -1)[0].hours + ' h') : '—', 'Sleep, water, steps')}
    ${tile('mind', 'teal', 'smile', 'Mind', mood ? ['😣', '😕', '🙂', '😊', '😄'][mood.mood - 1] : '🙂', 'Breathe & check in')}</div></div>
   <details class="acc section"><summary><span class="q teal" style="width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center">${H.icon('health')}</span>Conditions <span class="badge" style="margin-left:6px">${S.conditions.length}</span></summary><div class="ac">${S.conditions.map(c => `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--border)"><div><b>${H.esc(c.name)}</b><div class="small muted">${c.since ? 'since ' + H.esc(c.since) : ''}</div></div><button class="iconbtn" data-act="edit-cond" data-id="${c.id}">${H.icon('edit')}</button></div>`).join('') || '<p class="small muted">None recorded.</p>'}<button class="btn sm sec" data-act="edit-cond" style="margin-top:10px">${H.icon('plus')}Add condition</button></div></details>
   <details class="acc"><summary><span class="q blue" style="width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center">${H.icon('list')}</span>History, devices & blood group</summary><div class="ac"><div class="why"><dl><dt>Surgeries</dt><dd>${H.esc(S.history.surgeries.join(', ') || '—')}</dd><dt>Devices</dt><dd>${H.esc(S.history.devices.join(', ') || '—')}</dd><dt>Diet</dt><dd>${H.esc(S.history.diet || '—')}</dd><dt>Blood group</dt><dd>${H.esc(S.profile.bloodGroup || 'not recorded')}</dd></dl></div><button class="btn sm sec" data-act="edit-history" style="margin-top:10px">Edit</button></div></details>`;
};
H.actions['edit-cond'] = el => { const c = el.dataset.id ? H.byId(H.state.conditions, el.dataset.id) : { name: '', since: '', notes: '' };
  H.modal(`<div class="modal-head"><h2>${el.dataset.id ? 'Edit' : 'Add'} condition</h2><button class="iconbtn" data-act="close">${H.icon('x')}</button></div><form data-form="cond"><input type="hidden" name="id" value="${el.dataset.id || ''}">${H.c.field('name', 'Condition', c.name, 'text', 'required list="condlist"')}<datalist id="condlist">${Object.keys(H.TR.terms).map(t => `<option value="${t.replace(/\b\w/g, x => x.toUpperCase())}">`).join('')}</datalist><div class="grid g2">${H.c.field('since', 'Since (year)', c.since)}${H.c.field('notes', 'Notes', c.notes)}</div><div class="row"><button class="btn">Save</button>${el.dataset.id ? `<button type="button" class="btn ghost" data-act="del-cond" data-id="${c.id}">Delete</button>` : ''}</div></form>`); };
H.forms.cond = f => { const S = H.state; if (f.id) Object.assign(H.byId(S.conditions, f.id), { name: f.name, since: f.since, notes: f.notes }); else S.conditions.push({ id: H.uid('d'), name: f.name, since: f.since, notes: f.notes }); H.audit('Condition saved', f.name); H.save(); H.closeModal(); H.render(); };
H.actions['del-cond'] = el => { H.state.conditions = H.state.conditions.filter(c => c.id !== el.dataset.id); H.save(); H.closeModal(); H.render(); };
H.actions['edit-history'] = () => { const h = H.state.history; H.modal(`<div class="modal-head"><h2>History & devices</h2><button class="iconbtn" data-act="close">${H.icon('x')}</button></div><form data-form="history">${H.c.field('surgeries', 'Surgeries (comma separated)', h.surgeries.join(', '))}${H.c.field('devices', 'Implanted devices', h.devices.join(', '))}<div class="grid g2">${H.c.field('restrictions', 'Restrictions', h.restrictions)}${H.c.field('mobility', 'Mobility', h.mobility)}${H.c.field('diet', 'Diet', h.diet)}${H.c.field('bloodGroup', 'Blood group', H.state.profile.bloodGroup)}${H.c.field('pregnancy', 'Pregnancy (optional)', h.pregnancy)}</div><button class="btn">Save</button></form>`); };
H.forms.history = f => { const h = H.state.history; h.surgeries = f.surgeries.split(',').map(x => x.trim()).filter(Boolean); h.devices = f.devices.split(',').map(x => x.trim()).filter(Boolean); Object.assign(h, { restrictions: f.restrictions, mobility: f.mobility, diet: f.diet, pregnancy: f.pregnancy }); H.state.profile.bloodGroup = f.bloodGroup; H.save(); H.closeModal(); H.render(); };

/* ---------- medicines ---------- */
H.actions['edit-med'] = el => { const m = el.dataset.id ? H.byId(H.state.meds, el.dataset.id) : { name: '', generic: '', brand: '', dose: '', unit: 'mg', route: 'Oral', freq: 'Once daily', times: ['08:00'], indication: '', prescriber: '', instructions: '', storage: '', tempSensitive: false, timeCritical: false, reminder: true, supplyDays: '' };
  H.modal(`<div class="modal-head"><h2>${el.dataset.id ? 'Edit' : 'Add'} medicine</h2><button class="iconbtn" data-act="close">${H.icon('x')}</button></div>
  <form data-form="med"><input type="hidden" name="id" value="${el.dataset.id || ''}"><div class="grid g2">${H.c.field('name', 'Medicine name', m.name, 'text', 'required')}${H.c.field('generic', 'Generic name', m.generic)}${H.c.field('brand', 'Brand name', m.brand)}${H.c.field('indication', 'What it is for', m.indication)}
  ${H.c.field('dose', 'Dose (as prescribed)', m.dose, 'text', 'required')}${H.c.select('unit', 'Unit', ['mg', 'mcg', 'g', 'units', 'ml', 'puffs', 'mcg/puff', 'tablet(s)', 'drops'], m.unit)}${H.c.select('route', 'Route', ['Oral', 'Subcutaneous', 'Inhaled', 'Topical', 'Intramuscular', 'Sublingual', 'Eye', 'Other'], m.route)}${H.c.select('freq', 'Frequency', ['Once daily', 'Twice daily', 'Three times daily', 'Four times daily', 'Every 8 hours', 'Every 12 hours', 'Weekly', 'As needed'], m.freq)}</div>
  ${H.c.field('times', 'Scheduled times (home time, comma separated 24h)', (m.times || []).join(', '), 'text', 'placeholder="08:00, 20:00"')}
  <div class="grid g2">${H.c.field('prescriber', 'Prescribing clinician', m.prescriber)}${H.c.field('duration', 'Duration', m.duration || 'Ongoing')}</div>${H.c.field('instructions', 'Important instructions', m.instructions)}${H.c.field('storage', 'Storage requirements', m.storage)}
  ${H.c.sw('tempSensitive', 'Temperature sensitive', m.tempSensitive)}${H.c.sw('timeCritical', 'Time critical (clinician-designated)', m.timeCritical, 'HERMES also auto-detects insulin, anticoagulants, antiepileptics, immunosuppressants and others.')}${H.c.sw('reminder', 'Remind me', m.reminder !== false)}
  <div class="note warn" style="margin:12px 0">Enter exactly what your prescription says. HERMES never calculates or changes a dose.</div>
  <div class="row"><button class="btn">Save medicine</button>${el.dataset.id ? `<button type="button" class="btn ghost" style="color:var(--coral-ink)" data-act="del-med" data-id="${m.id}">Delete</button>` : ''}</div></form>`, 'wide'); };
H.forms.med = f => { const S = H.state; const times = (f.times || '').split(',').map(x => x.trim()).filter(x => /^\d{1,2}:\d{2}$/.test(x)).map(x => x.padStart(5, '0'));
  const data = { name: f.name, generic: f.generic, brand: f.brand, indication: f.indication, dose: f.dose, unit: f.unit, route: f.route, freq: f.freq, times, prescriber: f.prescriber, duration: f.duration, instructions: f.instructions, storage: f.storage, tempSensitive: !!f.tempSensitive, timeCritical: !!f.timeCritical, reminder: !!f.reminder, active: true };
  if (f.id) Object.assign(H.byId(S.meds, f.id), data); else S.meds.push(Object.assign({ id: H.uid('m') }, data));
  S.trips.forEach(t => { H.mergeChecklist(t); H.mergeKit(t); }); H.audit('Medicine saved', f.name); H.save(); H.closeModal(); H.render(); };
H.actions['del-med'] = el => { H.state.meds = H.state.meds.filter(m => m.id !== el.dataset.id); H.audit('Medicine deleted'); H.save(); H.closeModal(); H.render(); };
H.actions['med-log'] = el => { H.state.medLogs.push({ id: H.uid('l'), medId: el.dataset.med, dueAt: el.dataset.due, at: H.now().toISOString(), status: el.dataset.status }); H.audit('Dose ' + el.dataset.status); H.save(); H.toast(el.dataset.status === 'taken' ? 'Dose recorded as taken' : 'Dose recorded as skipped'); H.render(); };

/* visual home-vs-destination dose timeline */
H.medTimelineSvg = A => {
  const W = 760, rowH = 46, top = 34; const rows = [['Stay on home time', A.home]]; rows.push(['Switch to destination clock', A.local]); if (A.planned) rows.push(['Clinician-approved plan', A.planned]);
  const Hh = top + rows.length * rowH + 30; const a = A.dep.getTime() - 30 * 3600000, b = A.arr.getTime() + 48 * 3600000; const x = t => 150 + (t - a) / (b - a) * (W - 170);
  let s = `<svg class="medtl" viewBox="0 0 ${W} ${Hh}" style="width:100%;min-width:620px">`;
  s += `<rect x="${x(A.dep)}" y="${top - 6}" width="${x(A.arr) - x(A.dep)}" height="${rows.length * rowH + 4}" fill="#E8F2FD"/><text x="${(x(A.dep) + x(A.arr)) / 2}" y="${Hh - 6}" text-anchor="middle" style="fill:#164E8A;font-weight:600">✈ flight</text>`;
  for (let t = Math.ceil(a / 43200000) * 43200000; t <= b; t += 43200000) { const X = x(t); s += `<line x1="${X}" x2="${X}" y1="${top - 6}" y2="${top + rows.length * rowH - 2}" stroke="#E2E8F0"/><text x="${X}" y="12" text-anchor="middle">${H.fmtTime(new Date(t), A.f.fromTz)} ${H.tzShort(A.f.fromTz)}</text><text x="${X}" y="25" text-anchor="middle" style="fill:#0F766E">${H.fmtTime(new Date(t), A.f.toTz)} ${H.tzShort(A.f.toTz)}</text>`; }
  rows.forEach(([label, R], i) => { const y = top + i * rowH + 18; s += `<text x="0" y="${y + 4}" style="fill:#0B1D33;font-weight:600">${label}</text><line x1="150" x2="${W - 20}" y1="${y}" y2="${y}" stroke="#CBD5E1"/>`;
    R.intervals.forEach(iv => { const dev = Math.abs(iv.h - A.norm); const mx = (x(iv.from.at) + x(iv.to.at)) / 2; s += `<text x="${mx}" y="${y - 8}" text-anchor="middle" style="fill:${dev >= 1 ? '#8A5A00' : '#66758A'};font-weight:${dev >= 1 ? 700 : 400}">${H.fmtDur(iv.h)}</text>`; });
    R.doses.forEach(d => { const X = x(d.at); const inF = d.at >= A.dep && d.at <= A.arr; s += `<circle cx="${X}" cy="${y}" r="7" fill="${inF ? '#F4B942' : d.custom ? '#164E8A' : '#0F766E'}" stroke="#fff" stroke-width="2"><title>${H.fmtDT(d.at, A.f.fromTz)} ${H.tzShort(A.f.fromTz)} = ${H.fmtDT(d.at, A.f.toTz)} ${H.tzShort(A.f.toTz)}</title></circle><text x="${X}" y="${y + 20}" text-anchor="middle" style="font-size:10px">${H.fmtTime(d.at, d.at < A.arr ? A.f.fromTz : A.f.toTz)}</text>`; }); });
  return s + '</svg>';
};
H.views.meds = () => {
  const S = H.state; const t = H.trip.focus(); const now = H.now(); const ctx = H.context();
  const up = H.med.upcoming(8);
  const list = `<div class="card"><div class="card-head"><h3>Your medicines</h3><button class="btn sm" data-act="edit-med">${H.icon('plus')}Add</button></div>${S.meds.length ? `<div class="scroll-x"><table class="t"><thead><tr><th>Medicine</th><th>Dose</th><th>Schedule (home)</th><th>Travel status</th><th></th></tr></thead><tbody>${S.meds.map(m => { const r = H.med.risk(m); const st = H.med.strategy(m, t); return `<tr><td><b>${H.esc(m.name)}</b><div class="small muted">${H.esc(m.generic || '')}${m.brand ? ' · ' + H.esc(m.brand) : ''} · ${H.esc(m.route)}${m.indication ? ' · ' + H.esc(m.indication) : ''}</div>${r ? `<span class="badge caution" title="${H.esc(r.why)}">${H.esc(r.cls)} · time-critical</span> ` : ''}${m.tempSensitive ? '<span class="badge info">Temperature-sensitive</span>' : ''}</td><td class="mono">${H.esc(m.dose)} ${H.esc(m.unit)}</td><td class="mono">${H.esc(m.freq)}<div class="small muted">${m.times.join(', ') || '—'} ${m.times.length ? H.tzShort(H.homeTz()) : ''}</div></td><td class="small">${t ? `${st.pendingReview ? '<span class="badge caution">Needs professional review</span>' : st.plan && H.med.approved(st.plan) ? '<span class="badge ok">Approved plan</span>' : `<span class="badge">${st.mode === 'local' ? 'Destination clock' : 'Home time'}</span>`}<div class="muted">${H.esc(st.reason)}</div>` : '—'}</td><td><button class="iconbtn" data-act="edit-med" data-id="${m.id}">${H.icon('edit')}</button></td></tr>`; }).join('')}</tbody></table></div>` : '<p class="muted small">No medicines yet.</p>'}</div>`;
  const rem = `<div class="card"><div class="card-head"><h3>Upcoming doses</h3><span class="small muted">local ${H.tzShort(ctx.tz)}${ctx.tz !== H.homeTz() ? ' · home ' + H.tzShort(H.homeTz()) : ''}</span></div>${up.length ? `<ul class="list">${up.map(x => `<li><div class="ico ${x.overdue ? 'coral' : 'teal'}">${H.icon('pill')}</div><div class="grow"><div class="t">${H.esc(x.m.name)} ${H.esc(x.m.dose)} ${H.esc(x.m.unit)}</div><div class="s mono">${H.fmtDT(x.d.at, ctx.tz)} ${H.tzShort(ctx.tz)}${ctx.tz !== H.homeTz() ? ' · ' + H.fmtTime(x.d.at, H.homeTz()) + ' ' + H.tzShort(H.homeTz()) : ''}${x.overdue ? ' · <b style="color:var(--coral-ink)">due</b>' : ''}</div></div><button class="btn sm teal" data-act="med-log" data-med="${x.m.id}" data-due="${x.d.at.toISOString()}" data-status="taken">Taken</button><button class="btn sm sec" data-act="med-log" data-med="${x.m.id}" data-due="${x.d.at.toISOString()}" data-status="skipped">Skip</button></li>`).join('')}</ul>` : '<p class="muted small">No scheduled doses in the next 36 h.</p>'}
    ${S.medLogs.length ? `<div class="sep"></div><h4>Recent log</h4><ul class="list">${S.medLogs.slice(-4).reverse().map(l => { const m = H.byId(S.meds, l.medId); return `<li class="small"><span class="badge ${l.status === 'taken' ? 'ok' : 'caution'}">${l.status}</span><span class="grow">${H.esc(m ? m.name : 'Removed medicine')} · due ${H.fmtDT(new Date(l.dueAt), ctx.tz)}</span></li>`; }).join('')}</ul>` : ''}</div>`;
  let planner = '';
  if (t && H.trip.outbound(t)) {
    const out = H.trip.outbound(t); const shift = H.trip.shiftHours(out.fromTz, out.toTz, H.trip.dep(out));
    const scheduled = S.meds.filter(m => H.med.times(m).length && m.active !== false);
    planner = `<div class="section"><div class="row between" style="margin-bottom:10px"><div><h2>Travel medication planner</h2><p class="muted small" style="margin:2px 0 0">${H.esc(t.name)} · ${H.esc(out.from)} → ${H.esc(out.to)} · ${H.fmtDT(H.trip.dep(out), out.fromTz)} ${H.tzShort(out.fromTz)} → ${H.fmtDT(H.trip.arr(out), out.toTz)} ${H.tzShort(out.toTz)} · clock ${shift >= 0 ? '+' : '−'}${H.fmtDur(Math.abs(shift))}</p></div>${H.c.tripPicker()}</div>
     <div class="note warn" style="margin-bottom:14px"><b>HERMES calculates times and intervals only.</b> It never changes a dose, never prescribes, and does not recommend dose increases or decreases for eastward or westward travel. Time-critical medicines need a schedule from your prescriber or pharmacist, which you can record here.</div>
     ${scheduled.map(m => { const A = H.med.analyse(m, t); if (!A) return ''; const p = H.med.plan(t.id, m.id); const ap = H.med.approved(p); const st = H.med.strategy(m, t);
      return `<div class="card"><div class="row between"><div><h3>${H.esc(m.name)} <span class="muted" style="font-weight:500">${H.esc(m.dose)} ${H.esc(m.unit)} · ${H.esc(m.freq)} at ${m.times.join(', ')} ${H.tzShort(out.fromTz)}</span></h3>
       <div class="row" style="gap:6px;margin-top:4px">${A.risk ? `<span class="badge caution">${H.esc(A.risk.cls)}</span>` : ''}<span class="badge ${A.complexity === 'review' ? 'urgent' : A.complexity === 'moderate' ? 'caution' : A.complexity === 'low' ? 'info' : 'ok'}">${A.complexity === 'review' ? 'Professional review required' : A.complexity === 'moderate' ? 'Scheduling complexity' : A.complexity === 'low' ? 'Minor clock change' : 'No change'}</span>${ap ? `<span class="badge ok">Approved by ${H.esc(p.approvedBy)}</span>` : ''}</div></div>
       <button class="btn sm ${A.risk && !ap ? '' : 'sec'}" data-act="med-plan" data-id="${m.id}">${ap ? 'Edit approved plan' : A.risk ? 'Record clinician-approved plan' : 'Choose schedule'}</button></div>

     ${H.lineChart(Object.assign({ t0: t0.getTime(), t1: t1.getTime(), bands, label: title }, opt))}${last ? `<p class="small muted" style="margin:6px 0 0">Latest ${H.fmtReading(last)} ${H.REF[type].unit} · ${H.fmtDT(new Date(last.at), H.context().tz)}${last.context ? ' · ' + H.esc(last.context) : ''}</p>` : ''}</div>`; };
  const sleepPts = S.sleepLogs.filter(l => { const d = new Date(l.date + 'T08:00:00Z'); return d >= t0 && d <= t1; }).map(l => ({ t: new Date(l.date + 'T08:00:00Z').getTime(), v: +l.hours, note: l.quality }));
  const stepPts = S.activityLogs.filter(l => { const d = new Date(l.date + 'T18:00:00Z'); return d >= t0 && d <= t1; }).map(l => ({ t: new Date(l.date + 'T18:00:00Z').getTime(), v: l.steps }));
  return H.c.ph('Health tracking', 'Longitudinal readings with your reference ranges and travel periods. Manual entry — or a genuinely connected device in future.', 'Health', `<div class="seg">${[['1', '24 h'], ['7', '7 d'], ['30', '30 d'], ['90', '90 d'], ['custom', 'Custom']].map(([k, l]) => `<button class="${range === k ? 'on' : ''}" data-act="range" data-k="${k}">${l}</button>`).join('')}</div><button class="btn" data-act="add-reading">${H.icon('plus')}Log reading</button>`, ['health', 'Health']) +
   (range === 'custom' ? `<form class="row card" data-form="range" style="margin-bottom:14px"><label>From <input class="in" type="date" name="from" value="${H.param.from || ''}"></label><label>To <input class="in" type="date" name="to" value="${H.param.to || ''}"></label><button class="btn sm">Apply</button></form>` : '') +
   (S.synthetic ? `<div style="margin-bottom:14px">${H.c.syn('Readings in this demo profile are synthetic')}</div>` : '') +
   `<div class="grid g2">${chart('Blood pressure', 'bp', { series: [{ name: 'Systolic', color: '#1E88E5', points: pts('bp', 'v1') }, { name: 'Diastolic', color: '#0F9484', dash: true, points: pts('bp', 'v2') }], unit: 'mmHg', ref: [80, 120] })}
    ${chart('Blood glucose', 'glucose', { series: [{ name: 'Glucose', color: '#1E88E5', points: pts('glucose') }], unit: 'mg/dL', ref: [70, 130] })}
    ${chart('Oxygen saturation', 'spo2', { series: [{ name: 'SpO₂', color: '#1E88E5', points: pts('spo2') }], unit: '%', ref: [95, 100] })}
    ${chart('Heart rate', 'hr', { series: [{ name: 'HR', color: '#1E88E5', points: pts('hr') }], unit: 'bpm', ref: [60, 100] })}

    <div class="card"><div class="card-head"><h3>Sleep</h3><button class="btn sm sec" data-act="log-sleep">Log</button></div>${H.lineChart({ series: [{ name: 'Sleep', color: '#1E88E5', points: sleepPts }], unit: 'h', t0: t0.getTime(), t1: t1.getTime(), bands, ref: [7, 9], label: 'Sleep' })}</div>
    <div class="card"><div class="card-head"><h3>Activity</h3><button class="btn sm sec" data-act="log-steps">Log</button></div>${H.lineChart({ series: [{ name: 'Steps', color: '#1E88E5', points: stepPts }], unit: 'steps', t0: t0.getTime(), t1: t1.getTime(), bands, label: 'Steps' })}</div></div>
   <div class="card section"><div class="card-head"><h3>All readings</h3><span class="small muted">${R.length} in range</span></div><div class="scroll-x" style="max-height:320px;overflow-y:auto"><table class="t"><thead><tr><th>When</th><th>Measurement</th><th>Value</th><th>Reference</th><th>Context</th><th>Source</th><th></th></tr></thead><tbody>${R.slice().sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 120).map(r => { const lv = H.readingLevel(r); return `<tr><td class="mono small">${H.fmtDT(new Date(r.at), H.context().tz)}</td><td>${H.REF[r.type].label}</td><td class="mono"><b>${H.fmtReading(r)}</b> ${H.REF[r.type].unit}${lv !== 'ok' ? ` <span class="badge ${lv}">${lv}</span>` : ''}</td><td class="small muted">${H.REF[r.type].normal}</td><td class="small">${H.esc(r.context || '')}</td><td>${r.source === 'synthetic' ? '<span class="badge syn">synthetic</span>' : '<span class="badge">manual</span>'}</td><td>${r.source !== 'synthetic' ? `<button class="iconbtn" data-act="del-reading" data-id="${r.id}">${H.icon('trash')}</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div></div>

};

H.views.wellness = () => {
  const S = H.state; const ctx = H.context(); const today = H.parts(H.now(), ctx.tz).date; const t = H.trip.focus();
  const last7 = S.sleepLogs.filter(l => l.date <= today).sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 7); const avg = last7.length ? last7.reduce((s, l) => s + +l.hours, 0) / last7.length : null;
  const hyd = S.hydration.find(h => h.date === today); const goal = +S.lifestyle.hydration || 2000; const steps = S.activityLogs.find(a => a.date === today);
  const tips = []; if (avg != null && avg < 6.5) tips.push('Your recent sleep is below 7 hours — protect tonight\'s sleep window and keep naps under 30 minutes.'); if (S.lifestyle.caffeine !== 'none') tips.push(`Keep caffeine before ${H.fromMin(H.toMin(S.lifestyle.bed) - 360)} so it doesn't push back sleep.`); if (ctx.travelling) tips.push('After long travel, plan a lighter first day before strenuous activity.'); else if (t) tips.push('In the days before departure, keep a steady routine — see your circadian plan.'); if (!hyd || hyd.ml < goal / 2) tips.push('You are under half your water goal today.');

   `<div class="grid g4"><div class="card stat"><div class="k">Sleep (7-night avg)</div><div class="v">${avg != null ? H.round(avg, 1) : '—'}<small> h</small></div><div class="b">Usual ${H.round((H.toMin(S.lifestyle.wake) - H.toMin(S.lifestyle.bed) + 1440) % 1440 / 60, 1)} h · adults 7–9 h</div></div>
    <div class="card stat"><div class="k">Water today</div><div class="v">${hyd ? (hyd.ml / 1000).toFixed(1) : 0}<small> / ${(goal / 1000).toFixed(1)} L</small></div><div class="meter"><i style="width:${Math.min(100, (hyd ? hyd.ml : 0) / goal * 100)}%"></i></div></div>
    <div class="card stat"><div class="k">Steps today</div><div class="v">${steps ? steps.steps.toLocaleString() : '—'}</div></div>
    <div class="card stat"><div class="k">Bedtime target</div><div class="v">${S.lifestyle.bed}</div><div class="b">${ctx.travelling ? 'see circadian plan for travel days' : 'home routine'}</div></div></div>
   <div class="grid g2 section"><div class="card"><h3>Today's recovery summary</h3><ul class="small" style="padding-left:18px">${tips.map(x => `<li style="margin-bottom:6px">${H.esc(x)}</li>`).join('') || '<li>You are on track today.</li>'}</ul><div class="row"><button class="btn sm sec" data-act="water" data-ml="250">+250 ml</button><button class="btn sm sec" data-act="log-sleep">Log sleep</button><button class="btn sm sec" data-act="log-steps">Log steps</button>${t ? '<a class="btn sm sec" href="#circadian">Jet-lag plan</a>' : ''}</div></div>
    <div class="card"><h3>Habits that help on the road</h3><ul class="small" style="padding-left:18px"><li>Keep sleep and wake times steady where feasible.</li><li>Dark, cool, quiet room; eye mask and earplugs travel well.</li><li>Reduce screens in the hour before sleep.</li><li>Short naps (20–30 min) only, and not late in the day.</li><li>On long flights, stand and walk every 1–2 hours and do calf exercises.</li></ul></div></div>
   <div class="card section"><h3>Sleep log</h3>${last7.length ? `<table class="t"><thead><tr><th>Night</th><th>Hours</th><th>Quality</th><th>Source</th></tr></thead><tbody>${last7.map(l => `<tr><td>${fd(l.date)}</td><td class="mono">${l.hours}</td><td>${l.quality}</td><td>${l.source === 'synthetic' ? '<span class="badge syn">synthetic</span>' : 'manual'}</td></tr>`).join('')}</tbody></table>` : '<p class="small muted">No sleep logged.</p>'}</div>`;
};
H.views.mind = () => {
  const S = H.state; const last = S.moods.slice(-5).reverse();

   `<div class="grid g2" style="align-items:start"><form class="card" data-form="mood"><h3>Check-in</h3><label class="f"><span>Mood right now</span></label><div class="pills" style="margin-bottom:12px">${['😣 Low', '😕 Meh', '🙂 OK', '😊 Good', '😄 Great'].map((m, i) => `<label class="pill"><input type="radio" name="mood" value="${i + 1}" ${i === 2 ? 'checked' : ''} style="margin-right:6px">${m}</label>`).join('')}</div>
     <label class="f"><span>Stress level: <b id="stv">3</b>/5</span><input type="range" name="stress" min="1" max="5" value="3" style="width:100%" oninput="document.getElementById('stv').textContent=this.value"></label>${H.c.area('note', 'Anything on your mind? (optional)', '')}
     <label class="check"><input type="checkbox" name="danger"><span class="small">I feel unsafe or I'm thinking about harming myself</span></label><button class="btn">Save check-in</button></form>
    <div class="card" style="text-align:center"><h3>Box breathing</h3><p class="small muted">In 4 · hold 4 · out 4 · hold 4</p><div class="breath" id="breath">Ready</div><button class="btn sm" data-act="breathe">Start 1 minute</button></div></div>
   <div class="grid g3 section"><div class="card"><h3>5-4-3-2-1 grounding</h3><p class="small">Name 5 things you can see, 4 you can feel, 3 you can hear, 2 you can smell and 1 you can taste. Useful in a busy airport or unfamiliar place.</p></div>

   ${last.length ? `<div class="card section"><h3>Recent check-ins</h3>${last.map(m => `<div class="small" style="padding:6px 0">${H.ago(m.at)} · mood ${m.mood}/5 · stress ${m.stress}/5 ${m.note ? '· ' + H.esc(m.note) : ''}</div>`).join('')}</div>` : ''}`;

H.crisis = () => { const ctx = H.context(); const c = H.COUNTRIES[ctx.country] || H.COUNTRIES.India;

H.forms.mood = f => { H.state.moods.push({ id: H.uid('mo'), at: H.now().toISOString(), mood: +f.mood, stress: +f.stress, note: f.note }); H.save(); if (f.danger || (+f.mood === 1 && +f.stress === 5)) { H.crisis(); return; } H.toast(+f.stress >= 4 ? 'Thanks for checking in. Try the breathing exercise.' : 'Check-in saved'); H.render(); };

H.actions.breathe = el => { const b = document.getElementById('breath'); if (!b || H.ui.breathing) return; H.ui.breathing = true; el.disabled = true; let i = 0; const ph = ['Breathe in', 'Hold', 'Breathe out', 'Hold'];

<script>

/* AI translation with number-preservation check */
H.actions['pp-translate'] = async el => {
  const lang = el.dataset.l; const S = H.state; const items = [...new Set([...S.conditions.map(c => c.name), ...S.allergies.map(a => a.reaction), ...S.meds.map(m => m.indication), S.passport.notes].filter(Boolean).filter(x => !H.tr(x, lang)))];
  if (!H.isOnline()) return H.toast('Translation needs a connection. Built-in glossary translations are still shown.');
  if (!H.caps.sample) return H.toast('AI translation is not available in this view. Built-in glossary translations are shown.');
  el.disabled = true; el.textContent = 'Translating…';
  try {
    const prompt = `Translate each English medical phrase into ${H.LANGS[lang]} for a clinician. Rules: keep every number, unit, medicine name and dose exactly as written (do not translate or convert them); do not add, remove or soften meaning; if a phrase is ambiguous, translate literally. Return ONLY a JSON object mapping each original English string (exactly as given) to its translation.\n\n${JSON.stringify(items)}`;
    const out = await H.caps.sample.json(prompt, { modelTier: 'default' });
    const map = {}; const flags = [];
    items.forEach(src => { const tr = out && out[src]; if (!tr || typeof tr !== 'string') return; const nums = (src.match(/\d+(\.\d+)?/g) || []); if (nums.every(n => tr.includes(n))) map[src] = tr; else flags.push(src); });
    const prev = S.passport.translations[lang] || { map: {} };
    S.passport.translations[lang] = { map: Object.assign(prev.map || {}, map), method: 'ai', at: new Date().toISOString(), flags };
    H.audit('Passport translated', H.LANGS[lang]); H.save(); H.toast(`${Object.keys(map).length} item(s) translated — please verify`); H.render();
  } catch (e) { H.toast(e && e.code === 'rate_limited' ? 'Translation is busy — try again shortly.' : 'Translation was not completed. Built-in glossary shown.'); el.disabled = false; }
};

    <div class="grid g2">${H.c.select('ttl', 'Expires after', [['1', '1 hour'], ['24', '24 hours'], ['72', '3 days'], ['168', '7 days']], '24')}${H.c.field('recipient', 'Shared with <em>(for your records)</em>', '', 'text', 'placeholder="e.g. ER doctor, Tokyo"')}</div>
    <label class="check"><input type="checkbox" name="consent" required><span class="small">I consent to sharing these sections with this recipient until the link expires or I revoke it.</span></label><button class="btn">Create secure share</button></form>
    <div class="stack">${sel ? (() => { const [st, cl] = status(sel); return `<div class="card" style="text-align:center"><span class="badge ${cl}">${st}</span><h3 style="margin-top:8px">Share for ${H.esc(sel.recipient || 'healthcare provider')}</h3><div id="qr" style="display:inline-block;margin:12px auto;padding:10px;background:#fff;border:1px solid var(--border);border-radius:12px"></div>
      <div class="small">Access code: <b class="mono" style="font-size:16px;letter-spacing:.08em">${sel.token.slice(0, 4)}-${sel.token.slice(4, 8)}-${sel.token.slice(8, 12)}</b></div><div class="small muted">Expires ${H.fmtDT(new Date(sel.expiresAt), H.context().tz)} · sections: ${sel.sections.map(k => H.SHARE_SECTIONS.find(x => x[0] === k)[1]).join(', ')}</div>
      <div class="note" style="margin-top:10px;text-align:left"><b>Prototype limitation:</b> this demo has no shared server, so a token opens on this device only (hand your phone to the clinician, or open <a href="#handover">Clinician view</a>). In production the QR resolves to an authenticated, expiring HERMES link.</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm sec" data-act="copy-token" data-t="${sel.token}">Copy code</button>${!sel.revoked ? `<button class="btn sm danger" data-act="revoke" data-id="${sel.id}">Revoke now</button>` : ''}<a class="btn sm" href="#handover" data-act="prefill-token" data-t="${sel.token}">Open clinician view</a></div></div>`; })() : ''}
    <div class="card"><h3>Your shares</h3>${S.shares.length ? `<ul class="list">${S.shares.slice().reverse().map(s => { const [st, cl] = status(s); return `<li><span class="badge ${cl}">${st}</span><div class="grow"><div class="t">${H.esc(s.recipient || 'Healthcare provider')}</div><div class="s">${s.sections.length} sections · created ${H.ago(s.createdAt)} · ${s.accessCount || 0} views</div></div><button class="btn sm ghost" data-act="show-share" data-id="${s.id}">QR</button>${!s.revoked && st === 'Active' ? `<button class="btn sm ghost" style="color:var(--coral-ink)" data-act="revoke" data-id="${s.id}">Revoke</button>` : ''}</li>`; }).join('')}</ul>` : '<p class="small muted">No shares yet.</p>'}</div></div></div>`;
};
H.after.push(() => { const el = document.getElementById('qr'); const s = H.param.shareId && H.state && H.byId(H.state.shares, H.param.shareId); if (el && s && window.QRCode) { el.innerHTML = ''; try { new QRCode(el, { text: `HERMES-SHARE:v1:${s.token}`, width: 168, height: 168, colorDark: '#0B1D33', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch (e) { el.textContent = 'QR unavailable — use the access code.'; } } else if (el && !window.QRCode) el.textContent = 'QR library unavailable offline — use the access code.'; });
H.forms.share = f => { const S = H.state; const sections = H.SHARE_SECTIONS.map(x => x[0]).filter(k => f['sec_' + k]); if (!sections.length) return H.toast('Choose at least one section');
  const s = { id: H.uid('sh'), token: H.token(12), sections, recipient: f.recipient, createdAt: H.now().toISOString(), expiresAt: new Date(H.now().getTime() + (+f.ttl) * 3600000).toISOString(), revoked: false, accessCount: 0, snapshot: H.ppData(sections), lang: H.ppLang() };

H.actions.revoke = el => { const s = H.byId(H.state.shares, el.dataset.id); s.revoked = true; s.revokedAt = new Date().toISOString(); delete s.snapshot; H.audit('Passport share revoked'); H.save(); H.toast('Access revoked'); H.render(); };
H.actions['copy-token'] = el => H.copy(el.dataset.t);

H.views.handover = () => {
  const tok = (H.param.handoverToken || '').replace(/[^a-z0-9]/gi, '').toLowerCase(); const S = H.state; const s = tok && S.shares.find(x => x.token === tok);
  let body = '';
  if (tok) { if (!s) body = `<div class="note danger">No share matches this code on this device.</div>`; else if (s.revoked) body = `<div class="note danger">This share was revoked by the patient. No information is available.</div>`; else if (new Date(s.expiresAt) < H.now()) body = `<div class="note danger">This share expired on ${H.fmtDT(new Date(s.expiresAt), H.context().tz)}. No information is available.</div>`;
    else { if (!H.param.handoverLogged) { s.accessCount = (s.accessCount || 0) + 1; s.lastAccess = H.now().toISOString(); H.audit('Shared passport viewed', s.recipient || ''); H.save(); H.param.handoverLogged = true; } body = `<div class="note safe" style="margin-bottom:12px">Shared by the patient with consent · sections: ${s.sections.join(', ')} · access expires ${H.fmtDT(new Date(s.expiresAt), H.context().tz)}. Patient-reported information.</div>${H.ppHtml(s.snapshot, s.lang)}`; } }
  return H.c.ph('Clinician view', 'For the healthcare provider. Enter the access code from the patient\'s HERMES share.', 'Medical handover', '', ['share', 'Sharing']) +
   `<form class="card row" data-form="handover" style="margin-bottom:16px"><input class="in mono" name="token" value="${H.esc(tok)}" placeholder="xxxx-xxxx-xxxx" style="flex:1;font-size:18px;letter-spacing:.06em" required><button class="btn">Open</button></form>${body}`;

H.forms.handover = f => { H.param.handoverToken = f.token; H.param.handoverLogged = false; H.render(); };

/* ---------- emergency ---------- */
H.views.emergency = () => {
  const S = H.state; const ctx = H.context(); const t = ctx.trip; const cname = ctx.country || (t && ctx.status === 'in-transit' ? H.trip.flights(t).find(f => f === ctx.flight) && t.stops[0].country : S.profile.country); const c = H.COUNTRIES[cname] || H.COUNTRIES[S.profile.country];
  const em = c ? c.emergency[0] : null; const sym = H.param.triage && H.byId(S.symptoms, H.param.triage); const tri = sym && H.triage(sym);
  const er = S.facilities.filter(f => f.city === ctx.city && f.caps.includes('emergency'))[0];
  return `<div class="em"><div class="row between" style="margin-bottom:12px"><h1 style="color:var(--red)">Emergency</h1><span class="small muted">${H.esc(cname || '')} · ${H.fmtTime(H.now(), ctx.tz)} ${H.tzShort(ctx.tz)}</span></div>
   ${tri && tri.level === 'emergency' ? `<div class="alert emergency" style="margin-bottom:12px"><div class="ai">${H.icon('phone')}</div><div class="ab"><h3>${H.esc(tri.title)}</h3><p class="small" style="margin:0">${H.esc(tri.actions.join(' '))}</p></div></div>` : ''}
   ${em ? `<a class="em-btn call" href="tel:${em.num.replace(/[^0-9+#]/g, '')}"><div class="ico">${H.icon('phone')}</div><div>Call ${em.num}<small>${H.esc(em.label)} · ${H.esc(cname)}</small></div></a>` : ''}
   ${S.contacts[0] ? `<a class="em-btn" href="tel:${H.esc(S.contacts[0].phone.replace(/[^0-9+]/g, ''))}"><div class="ico">${H.icon('user')}</div><div>Call ${H.esc(S.contacts[0].name)}<small>${H.esc(S.contacts[0].relation)} · ${H.esc(S.contacts[0].phone)}</small></div></a>` : `<a class="em-btn" href="#prefs"><div class="ico">${H.icon('user')}</div><div>Add an emergency contact</div></a>`}
   ${S.allergies.length ? `<a class="em-btn" href="#allergycard" data-act="card-full-go"><div class="ico coral">${H.icon('shield')}</div><div>Show allergy card<small>Translated · full screen</small></div></a>` : ''}
   <a class="em-btn" href="#emergency-view"><div class="ico">${H.icon('passport')}</div><div>Show medical passport<small>Emergency view for clinicians</small></div></a>
   <a class="em-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('emergency hospital near ' + ctx.city.replace('In flight · ', ''))}" target="_blank" rel="noopener"><div class="ico">${H.icon('hospital')}</div><div>Find nearest emergency department<small>${er ? 'Saved: ' + H.esc(er.name) + ' · ' : ''}opens live maps</small></div></a>
   ${H.has.epi() ? `<div class="note danger" style="margin:6px 0 12px"><b>Anaphylaxis?</b> Use your adrenaline auto-injector (${H.esc(S.allergies.find(a => a.emergencyMed).emergencyMed)}) first, then call ${em ? em.num : 'emergency services'}. <a href="#exposure" data-act="exposure">Exposure steps</a></div>` : ''}
   ${c ? `<div class="card"><h3>Emergency numbers · ${H.esc(cname)}</h3><ul class="list">${c.emergency.map(e => `<li><div class="grow"><div class="t">${H.esc(e.label)}</div>${e.intl ? `<div class="s">From abroad ${e.intl}</div>` : ''}</div><a class="btn sm danger mono" href="tel:${e.num.replace(/[^0-9+#]/g, '')}">${e.num}</a></li>`).join('')}</ul><div class="small muted">${c.emStatus === 'verified' ? 'Verified' : 'Compiled — confirm locally'} · ${fd(c.emVerified)}</div>${H.c.src([c.emSource])}</div>` : ''}
   <p class="small muted" style="margin-top:12px">If you are in danger, call emergency services first. HERMES does not replace them and does not contact them for you.</p></div>`;
};
H.actions['card-full-go'] = () => { H.param.cardFull = true; };
H.views['emergency-view'] = () => { const S = H.state; const lang = H.ppLang();
  return `<div class="em"><a class="back" href="#emergency">${H.icon('left')}Emergency</a><div class="passport"><div class="pp-head"><div class="pp-photo">${S.profile.photo ? `<img src="${S.profile.photo}">` : (S.profile.name || '?')[0]}</div><div><div style="font-size:12px;letter-spacing:.12em;color:#F6C3BE;font-weight:700">MEDICAL EMERGENCY INFORMATION</div><div style="font-size:26px;font-weight:800;font-family:var(--display)">${H.esc(S.profile.name)}</div><div class="small" style="color:#C9D6E6">DOB ${H.esc(S.profile.dob)} · Blood ${H.esc(S.profile.bloodGroup || '?')}</div></div></div>
   <div class="pp-sec crit"><div class="lab" style="font-size:12px;font-weight:700;color:var(--coral-ink)">ALLERGIES · <span lang="${lang}">${H.TR.labels.allergies[lang]}</span></div><div style="font-size:22px;font-weight:800">${H.esc(S.allergies.map(a => a.allergen + ' (' + a.severity + ')').join(', ') || 'None known')}</div><div lang="${lang}" style="font-size:18px">${H.esc(S.allergies.map(a => H.tr(H.allergenKey(a.allergen), lang)).filter(Boolean).join(', '))}</div></div>
   <div class="pp-sec"><div class="lab" style="font-size:12px;font-weight:700;color:var(--muted)">CONDITIONS · <span lang="${lang}">${H.TR.labels.conditions[lang]}</span></div><div style="font-size:19px;font-weight:700">${H.esc(S.conditions.map(c => c.name).join(', ') || '—')}</div><div lang="${lang}" style="font-size:17px">${H.esc(S.conditions.map(c => H.tr(c.name, lang)).filter(Boolean).join(', '))}</div></div>
   <div class="pp-sec"><div class="lab" style="font-size:12px;font-weight:700;color:var(--muted)">MEDICINES · <span lang="${lang}">${H.TR.labels.meds[lang]}</span></div>${S.meds.map(m => `<div style="font-size:17px"><span class="keep" style="font-size:16px">${H.esc(m.name)} ${H.esc(m.dose)} ${H.esc(m.unit)}</span> ${H.esc(m.freq)}</div>`).join('') || '—'}</div>
   ${S.passport.notes ? `<div class="pp-sec crit" style="font-size:16px">${H.esc(S.passport.notes)}</div>` : ''}
   <div class="pp-sec"><div class="lab" style="font-size:12px;font-weight:700;color:var(--muted)">EMERGENCY CONTACT · <span lang="${lang}">${H.TR.labels.contact[lang]}</span></div>${S.contacts.map(c => `<div style="font-size:18px"><b>${H.esc(c.name)}</b> ${H.esc(c.relation)} · <span class="mono">${H.esc(c.phone)}</span></div>`).join('') || '—'}</div></div></div>`; };

</script>
<script>
/* HERMES AI assistant, profile & settings, privacy, notifications, integrations, offline, brand */
'use strict';
/* ================= AI assistant ================= */
H.AI_EMERG = /(chest pain|can'?t breathe|cannot breathe|difficulty breathing|throat (is )?(closing|tight)|anaphyla|unconscious|passed out|faint(ed|ing)|seizure|stroke|severe bleeding|choking|suicid|kill myself|end my life|self[- ]harm|overdose)/i;
H.aiContext = () => { const S = H.state; const c = S.ai.consent; const ctx = H.context(); const t = ctx.trip; const o = { now_local: `${H.fmtDT(H.now(), ctx.tz)} ${ctx.tz}`, location: ctx.city, home_tz: H.homeTz(), status: ctx.status };
  if (c.profile) o.profile = { age: S.profile.dob ? Math.floor((H.now() - new Date(S.profile.dob)) / 3.156e10) : null, sex: S.profile.sex, conditions: S.conditions.map(x => x.name), devices: S.history.devices, restrictions: S.history.restrictions };
  if (c.meds) o.medications = S.meds.map(m => ({ name: m.name, dose: m.dose + ' ' + m.unit, frequency: m.freq, times_home: m.times, time_critical: !!H.med.risk(m), travel_schedule: t ? H.med.strategy(m, t).reason : null }));
  if (c.allergies) o.allergies = S.allergies.map(a => ({ allergen: a.allergen, severity: a.severity, reaction: a.reaction, emergency_med: a.emergencyMed, plan: a.plan }));
  if (c.trip && t) o.trip = { name: t.name, from: t.origin.city, stops: t.stops.map(s => `${s.city}, ${s.country} ${s.arrive}→${s.depart} (${s.alt} m)`), flights: (t.flights || []).map(f => `${f.from} ${f.depDate} ${f.depTime} → ${f.to} ${f.arrDate} ${f.arrTime}`), activities: (t.activities || []).map(a => `${a.date} ${a.name}`) };
  if (c.readings) o.latest_readings = ['bp', 'glucose', 'spo2', 'hr'].map(k => { const r = H.latest(k); return r ? `${k} ${H.fmtReading(r)} ${H.REF[k].unit} (${H.ago(r.at)}, ${r.source}) ref ${H.REF[k].normal}` : null; }).filter(Boolean);
  if (c.symptoms) o.recent_symptoms = S.symptoms.slice(-5).map(s => `${s.type} ${s.severity}${s.temp ? ' ' + s.temp + '°C' : ''} at ${s.place} ${H.ago(s.at)}`);
  if (c.sleep) o.recent_sleep_hours = S.sleepLogs.filter(l => l.date <= H.parts(H.now(), ctx.tz).date).sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 3).map(l => l.hours);
  o.hermes_alerts = H.alerts().slice(0, 6).map(a => `${a.level}: ${a.title}`);
  if (t) o.destination_kb = H.trip.countries(t).map(n => { const k = H.COUNTRIES[n]; if (!k || !k.curated) return { country: n, note: 'No curated data' }; return { country: n, entry: k.entry.map(e => e.t), vaccines: k.vaccines.map(v => `${v.name}: ${v.who}`), diseases: k.diseases.map(d => `${d.name} (${d.level}): ${d.note}`), malaria: k.malaria.note, med_import: k.medImport.summary, emergency: k.emergency.map(e => `${e.label} ${e.num}`) }; });
  return o; };
H.AI_SOURCES = () => Object.entries(H.SOURCES).map(([k, s]) => `${k}: ${s.name}`).join('\n');
H.aiPrompt = () => `You are HERMES, a travel-health assistant inside the HERMES app. You help travellers prepare, stay well and respond to changes. Follow these rules strictly:
- You give health information and organisation help, not medical care. Never diagnose definitively, never prescribe, never recommend starting/stopping a medicine, and never calculate, change or suggest a dose or a dosing time shift. For time-critical medicines (insulin, anticoagulants, antiepileptics, immunosuppressants etc.) say a clinician or pharmacist must set the travel schedule and point to the app's Medication planner, which shows home-time vs destination-time intervals.
- Never invent readings, symptoms, medical history, drug interactions or contraindications. Use only the authorised user context below; if something clinically important is missing, ask one short follow-up question.
- Emergencies first: if anything suggests an emergency (chest pain, breathing difficulty, throat swelling, anaphylaxis, confusion, fainting, seizure, severe bleeding, thoughts of self-harm), your FIRST line tells them to call local emergency services now (use the number from context) and, for anaphylaxis, to use their prescribed adrenaline auto-injector. Keep it short.
- Fever during/after travel to malaria or dengue areas: recommend prompt medical assessment; never reassure because symptoms are mild.
- Distinguish clearly: what official guidance says (cite source ids) vs general information vs what needs a clinician. Express uncertainty honestly. Never claim a destination or food is "safe".
- Be calm, warm and concise: at most ~180 words unless asked for more. Use short paragraphs or simple "- " bullets, no markdown headings, no tables.
- At the very end add one line "SOURCES: id1,id2" using only ids from the source list that genuinely support destination-health claims (or "SOURCES: none"), then one line "OPEN: x,y" with up to 3 app screens that would help, chosen from: passport, allergycard, emergency, care, meds, circadian, kit, disease, env, symptoms, track, checklist, share.

Source list:
${H.AI_SOURCES()}

Authorised user context (JSON):
${JSON.stringify(H.aiContext())}`;
H.AI_SCREENS = { passport: 'Medical passport', allergycard: 'Allergy card', emergency: 'Emergency', care: 'Healthcare finder', meds: 'Medication planner', circadian: 'Circadian plan', kit: 'Travel kit', disease: 'Destination health', env: 'Environment', symptoms: 'Symptoms', track: 'Health tracking', checklist: 'Checklist', share: 'Secure share' };
H.aiParse = text => { let src = [], open = []; const lines = text.split('\n').filter(l => { const m1 = l.match(/^\s*SOURCES:\s*(.*)$/i), m2 = l.match(/^\s*OPEN:\s*(.*)$/i); if (m1) { src = m1[1].split(/[,\s]+/).filter(x => H.SOURCES[x]); return false; } if (m2) { open = m2[1].split(/[,\s]+/).filter(x => H.AI_SCREENS[x]).slice(0, 3); return false; } return true; }); return { text: lines.join('\n').trim(), src, open }; };
/* offline / unavailable fallback — rule based, built from the same engines */
H.aiLocal = q => { const S = H.state; const t = H.trip.focus(); const ql = q.toLowerCase(); const c = t && H.COUNTRIES[t.stops[0].country]; let text = '', src = [], open = [];
  if (H.AI_EMERG.test(q)) { const e = H.COUNTRIES[H.context().country] || c; text = `This may be an emergency. Call ${e ? e.emergency[0].num : 'local emergency services'} now.${/anaphyl|throat|breath/i.test(q) && H.has.epi() ? ' If this is an allergic reaction, use your prescribed adrenaline auto-injector first.' : ''}`; open = ['emergency', 'allergycard', 'passport']; }
  else if (/passport/.test(ql)) { text = 'Your medical passport is ready offline — open it below, or create an expiring share for a clinician.'; open = ['passport', 'share']; }
  else if (/kit|pack/.test(ql)) { const k = t ? t.kit.filter(x => !x.removed) : []; text = t ? `Your personalised kit for ${t.name} has ${k.length} items, including: ${k.filter(x => x.cat !== 'General').slice(0, 5).map(x => x.text).join('; ')}.` : 'Add a trip to personalise your kit.'; open = ['kit']; }
  else if (/medic|dose|insulin|time ?zone|pill/.test(ql)) { const r = S.meds.filter(m => H.med.risk(m)); text = `HERMES shows each medicine in home and destination time but never changes a dose or timing on its own.${r.length ? ` ${r.map(m => m.name).join(', ')} ${r.length > 1 ? 'are' : 'is'} time-critical: ask your prescriber or pharmacist for a travel schedule and record it in the planner.` : ''}`; open = ['meds']; src = ['yb']; }
  else if (/fever|temperature/.test(ql)) { const tr = H.triage({ type: 'Fever', severity: 'moderate', assoc: [] }); text = `${tr.title}. ${tr.reasons.join(' ')} ${tr.actions.join(' ')}`; src = tr.src; open = ['care', 'symptoms']; }
  else if (/sleep|jet ?lag|tired/.test(ql)) { const p = t && H.circ.plan(t); text = p ? `Your trip shifts the clock ${H.fmtDur(p.abs)} ${p.east ? 'east' : 'west'}; estimated adaptation ~${p.adaptDays} days. Follow the light and sleep windows in your circadian plan; keep naps short.` : 'Add a flight to get a jet-lag plan.'; open = ['circadian']; src = ['yb']; }
  else if (/altitude|trek/.test(ql)) { text = H.ALT.text + ' Warning signs: ' + H.ALT.warning.join('; ') + '.'; src = ['yb']; open = ['env']; }
  else if (/hospital|clinic|doctor|pharmacy|nearest/.test(ql)) { text = 'The healthcare finder separates nearest, emergency and appropriate facilities and links to live maps and official directories.'; open = ['care']; }
  else if (c) { text = `${t.stops[0].country}: ${c.entry[0].t} Recommended: ${c.vaccines.slice(0, 3).map(v => v.name).join('; ')}. ${c.malaria.note} A travel-medicine consultation 4–6 weeks before departure is advised for your conditions.`; src = [...new Set([...c.vaccines.map(v => v.src), c.malaria.src])]; open = ['disease', 'checklist']; }
  else text = 'I can help with destination health, medicines across time zones, sleep, symptoms, your kit and passport. Add a trip for personalised answers.';
  return { text: text + '\n\n(Offline answer from saved HERMES data — AI is unavailable right now.)', src, open }; };
H.views.ai = () => {
  const S = H.state; const cid = H.param.convo; let cv = cid && H.byId(S.ai.convos, cid);
  const ctx = H.context(); const avail = H.caps.sample && H.isOnline();
  const sug = ['What health preparation should I do for this trip?', 'My medication time is approaching, but I am in a different time zone.', 'I slept only four hours before a long flight. What should I prioritise?', 'What should I pack in my health kit?', 'I have developed a fever after travelling. What should I do?', 'Find the nearest appropriate emergency hospital.'];
  const msgs = cv ? cv.messages : [];
  return H.c.ph('HERMES AI', 'A travel-health assistant that knows your authorised profile, trip and readings. It explains, cites sources and escalates emergencies — it does not diagnose or prescribe.', 'Assistant', `<button class="btn sec" data-act="ai-new">${H.icon('plus')}New chat</button><button class="btn ghost" data-act="ai-consent">${H.icon('lock')}Data access</button>`) +
   `<div class="grid" style="grid-template-columns:minmax(0,1fr);gap:16px">

H.forms.ai = async f => {
  const S = H.state; const q = (f.q || '').trim(); if (!q || H.ui.aiBusy) return;
  let cv = H.param.convo && H.byId(S.ai.convos, H.param.convo); if (!cv) { cv = { id: H.uid('cv'), title: q, messages: [], at: new Date().toISOString() }; S.ai.convos.push(cv); H.param.convo = cv.id; }
  cv.messages.push({ role: 'user', content: q, at: new Date().toISOString() });
  if (H.AI_EMERG.test(q)) { const c = H.COUNTRIES[H.context().country] || H.COUNTRIES[(H.trip.focus() || { stops: [{}] }).stops[0].country] || H.COUNTRIES[S.profile.country]; cv.messages.push({ role: 'assistant', kind: 'emergency', content: `Call ${c ? c.emergency[0].num : 'local emergency services'} now.${/anaphyl|throat|breath/i.test(q) && H.has.epi() ? ' If this is an allergic reaction, use your prescribed adrenaline auto-injector first.' : ''}${/suicid|kill myself|end my life|self[- ]harm/i.test(q) ? ' You can also call Tele-MANAS on 14416 (India, 24/7).' : ''} Don't wait for the rest of this reply.` }); }
  H.save({ local: true }); H.render(); const input = document.querySelector('[name=q]'); if (input) input.value = '';
  const ans = { role: 'assistant', content: '…', at: new Date().toISOString() }; cv.messages.push(ans); H.render();
  const bubbles = () => document.querySelectorAll('#chat .msg.a'); const live = () => bubbles()[bubbles().length - 1];
  if (!H.caps.sample || !H.isOnline()) { Object.assign(ans, H.aiLocal(q), { offline: true }); ans.content = ans.text; delete ans.text; H.save({ local: true }); H.render(); return; }
  H.ui.aiBusy = true; const btn = document.getElementById('aisend'); if (btn) btn.disabled = true;
  try {
    const hist = cv.messages.filter(m => m !== ans && m.kind !== 'emergency').slice(-10).map(m => ({ role: m.role, content: m.content }));
    const input = [{ role: 'user', content: H.aiPrompt() + '\n\nReply "Ready." to confirm.' }, { role: 'assistant', content: 'Ready.' }, ...hist];
    const res = await H.caps.sample(input, { cache: false, modelTier: 'default', onText: ({ text }) => { const el = live(); if (el) el.textContent = H.aiParse(text).text; const ch = document.getElementById('chat'); } });
    const p = H.aiParse(res.text || ''); Object.assign(ans, { content: p.text || 'Sorry — no answer was returned.', src: p.src, open: p.open });
  } catch (e) { Object.assign(ans, H.aiLocal(q), { offline: true }); ans.content = (e && e.code === 'not_granted' ? '' : '') + ans.text; delete ans.text; }
  H.ui.aiBusy = false; H.save({ local: true }); H.render(); window.scrollTo(0, document.body.scrollHeight);
};

   <div class="card section"><h3>Palette</h3><div class="grid g4" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${sw.map(([n, c]) => `<div><div class="swatch" style="background:${c}"></div><div class="small" style="margin-top:6px"><b>${n}</b><br><span class="mono muted">${c}</span></div></div>`).join('')}</div></div>
   <div class="grid g2 section"><div class="card"><h3>Typography</h3><div style="font-family:var(--display);font-size:30px;font-weight:800">Manrope — headings</div><div style="font-size:17px;margin-top:6px">Inter — body and clinical text, tuned for small screens.</div><div class="small muted mono" style="margin-top:6px">Tabular figures: 08:00 IST · 142/88 mmHg</div><div lang="ja" style="font-size:18px;margin-top:6px">Noto Sans JP — 医療パスポート</div></div>
    <div class="card"><h3>Components</h3><div class="row"><button class="btn">Primary</button><button class="btn sec">Secondary</button><button class="btn teal">Confirm</button><button class="btn danger">Emergency</button></div><div class="row" style="margin-top:12px">${H.LEVELS.map(l => `<span class="badge ${l}">${H.LEVEL_LABEL[l]}</span>`).join('')}<span class="badge syn">Synthetic</span><span class="badge demo">Fictional demo</span></div></div></div>
   <div class="card section"><h3>Principles</h3><div class="grid g4">${['Human before technology', 'Health continuity', 'Context is everything', 'Trust over AI', 'Designed for disruption', 'Quiet by design', 'Actionable intelligence'].map(x => `<div class="small"><b>${x}</b></div>`).join('')}</div></div>`; };
H.actions['dl-logo'] = async () => { const svgs = [['hermes-mark.svg', H.mark(256)], ['hermes-mark-dark.svg', H.mark(256, H.markVariants.dark)], ['hermes-mark-mono.svg', H.mark(256, H.markVariants.mono)], ['hermes-app-icon.svg', H.appIcon(512)]];
  for (const [n, s] of svgs) { const ok = await H.download(n, s.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '), 'image/svg+xml'); if (!ok) break; } };

</script>
<script>
/* HERMES app bootstrap: routing, events, capabilities, reminders */
'use strict';
H.AUTH_ROUTES = ['welcome', 'login', 'signup', 'forgot', 'verify'];
Object.assign(H.SECTION_OF, { 'emergency-view': 'passport', exposure: 'health' });
H.actions.back = () => history.back();
H.views.notfound = () => H.c.empty('Page not found', 'That screen does not exist.', '<a class="btn" href="#home">Home</a>');
H.render = () => {
  let r = H.route(); const body = document.body; body.classList.remove('booting');
  if (!H.state) { if (!H.AUTH_ROUTES.includes(r)) r = 'welcome'; }
  else {
    if (H.AUTH_ROUTES.includes(r) && r !== 'verify') r = 'home';
    if (!H.state.profile.onboarded && !['onboarding', 'verify'].includes(r)) r = 'onboarding';
    if (!r) r = 'home';
  }
  const authLike = !H.state || ['onboarding', 'verify'].includes(r);
  body.classList.toggle('auth', authLike);
  if (!authLike) H.ui.shell(r);
  const view = H.views[r] || H.views.notfound; let html;
  try { html = view(); } catch (e) { console.error(e); html = `<div class="card"><h2>Something went wrong on this screen</h2><p class="muted small">${H.esc(e.message)}</p><a class="btn" href="#home">Go home</a></div>`; }
  const main = document.getElementById('main'); main.innerHTML = html;
  H.after.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  if (H.lastRoute !== r) { window.scrollTo(0, 0); H.lastRoute = r; }
};

/* events */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) { if (ev.target.id === 'overlay') H.closeModal(); return; }
  const name = el.dataset.act;
  if (name === 'close') { H.closeModal(); if (el.tagName !== 'A') ev.preventDefault(); return; }
  if (name === 'copy-modal') { const ta = document.querySelector('#overlay textarea'); H.copy(ta ? ta.value : ''); return; }
  const fn = H.actions[name]; if (!fn) return;
  if (el.tagName === 'BUTTON' && el.type !== 'submit') ev.preventDefault();
  try { const p = fn(el, ev); if (p && p.catch) p.catch(e => { console.error(e); H.toast('Something went wrong.'); }); } catch (e) { console.error(e); H.toast('Something went wrong.'); }
});
document.addEventListener('submit', ev => {
  const form = ev.target.closest('form[data-form]'); if (!form) return; ev.preventDefault();
  const data = {}; new FormData(form).forEach((v, k) => { if (!(v instanceof File)) data[k] = typeof v === 'string' ? v.trim() : v; });
  const fn = H.forms[form.dataset.form]; if (!fn) return;
  try { const p = fn(data, form); if (p && p.catch) p.catch(e => { console.error(e); H.toast('Could not save.'); }); } catch (e) { console.error(e); H.toast('Could not save: ' + e.message); }
});
document.addEventListener('change', ev => { const el = ev.target.closest('[data-change]'); if (!el) return; const fn = H.change[el.dataset.change]; if (fn) try { fn(el, ev); } catch (e) { console.error(e); } });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if (!document.getElementById('overlay').hidden) H.closeModal(); else if (H.param.cardFull) { H.param.cardFull = false; H.render(); } } });
window.addEventListener('hashchange', () => { H.closeModal(); H.render(); });
window.addEventListener('online', () => { H.net.online = true; H.ui.netbar(); H.sync.push(); });
window.addEventListener('offline', () => { H.net.online = false; H.ui.netbar(); });

/* platform capabilities (each resolves later or to null — the app works without them) */
H.initCaps = () => {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  const take = (k) => window.claude.use(k).then(ns => { H.caps[k] = ns || null; return ns; }).catch(() => null);
  Promise.all([take('db'), take('user')]).then(() => { if (H.state) H.sync.pull(); if (H.state) H.ui.netbar(); });
  take('sample').then(() => { if (['ai', 'integrations', 'passport'].includes(H.route())) H.render(); });
  take('downloads');
};

/* in-app medication reminders */
H.ui.notified = new Set();
H.reminderTick = () => {
  if (!H.state || !H.state.profile.onboarded) return; const now = H.now(); const ctx = H.context();
  H.state.meds.filter(m => m.reminder !== false && m.active !== false).forEach(m => H.med.schedule(m, new Date(now - 10 * 60000), new Date(now.getTime() + 60000)).forEach(d => {
    const key = m.id + d.at.getTime(); if (H.ui.notified.has(key) || H.med.logFor(m, d)) return; H.ui.notified.add(key);
    if (H.state.notifPrefs.med === false) return;
    H.notify(d.strategy.pendingReview ? 'caution' : 'info', `Time for ${m.name} ${m.dose} ${m.unit}`, `${H.fmtTime(d.at, ctx.tz)} ${H.tzShort(ctx.tz)}${ctx.tz !== H.homeTz() ? ' / ' + H.fmtTime(d.at, H.homeTz()) + ' ' + H.tzShort(H.homeTz()) : ''} · ${d.strategy.reason}`, 'meds', 'med');
    H.toast(`${H.icon('pill')} Time for <b>${H.esc(m.name)}</b> ${H.esc(m.dose)} ${H.esc(m.unit)}`, `<button class="btn sm teal" data-act="med-log" data-med="${m.id}" data-due="${d.at.toISOString()}" data-status="taken">Taken</button>`, 12000);
    H.save({ local: true }); H.ui.top && H.ui.top();
  }));
};

/* boot */
(function boot() {
  H.restoreSession();
  H.initCaps();
  H.render();
  setInterval(H.reminderTick, 30000); setTimeout(H.reminderTick, 3000);
  setInterval(() => { if (H.state && !document.getElementById('overlay').hidden === false && ['home'].includes(H.route()) && !document.querySelector('input:focus,textarea:focus')) H.ui.top(); }, 60000);
})();

</script>
</body>
</html>
