    ${S.conditions.length ? `<ul class="list">${S.conditions.map(c => `<li><div class="grow"><div class="t">${H.esc(c.name)}</div><div class="s">${c.since ? 'Since ' + H.esc(c.since) : ''}</div></div><button class="iconbtn" data-act="del-cond" data-id="${c.id}">${H.icon('trash')}</button></li>`).join('')}</ul>` : '<p class="small muted">No conditions added.</p>'}</div>
   <div class="card"><div class="card-head"><h3>Allergies</h3><button class="btn sm sec" data-act="edit-allergy">${H.icon('plus')}Add allergy</button></div>
    ${S.allergies.length ? `<ul class="list">${S.allergies.map(a => `<li><div class="grow"><div class="t">${H.esc(a.allergen)} <span class="badge ${a.severity === 'severe' ? 'urgent' : 'caution'}">${a.severity}</span></div><div class="s">${H.esc(a.reaction)}</div></div></li>`).join('')}</ul>` : '<p class="small muted">No allergies added.</p>'}</div>
   <form data-form="ob" class="card"><h3>Other history <em class="muted small" style="font-style:normal">optional</em></h3>
    ${H.c.field('surgeries', 'Surgical history <em>(comma separated)</em>', S.history.surgeries.join(', '))}${H.c.field('devices', 'Implanted devices <em>(e.g. pacemaker, insulin pump)</em>', S.history.devices.join(', '))}
    <div class="grid g2">${H.c.field('restrictions', 'Medical restrictions', S.history.restrictions)}${H.c.field('mobility', 'Mobility limitations', S.history.mobility)}${H.c.field('diet', 'Dietary restrictions', S.history.diet)}${H.c.field('pregnancy', 'Pregnancy <em>(only if you choose)</em>', S.history.pregnancy)}${H.c.field('bloodGroup', 'Blood group <em>(if known)</em>', p.bloodGroup)}</div>${nav(true)}</form>`;
  if (step === 2) body = `<h1>Your medicines</h1><p class="muted">HERMES uses these for reminders, time-zone checks, supply and your passport. It never changes a dose.</p>
   <div class="card" style="margin-top:16px"><div class="card-head"><h3>Medication list</h3><button class="btn sm" data-act="edit-med">${H.icon('plus')}Add medicine</button></div>
   ${S.meds.length ? `<ul class="list">${S.meds.map(m => `<li><div class="ico teal">${H.icon('pill')}</div><div class="grow"><div class="t">${H.esc(m.name)} ${H.esc(m.dose)} ${H.esc(m.unit)}</div><div class="s">${H.esc(m.freq)} ${m.times.length ? '· ' + m.times.join(', ') : ''} ${H.med.risk(m) ? '· <span class="badge caution">Time-critical</span>' : ''}</div></div><button class="iconbtn" data-act="edit-med" data-id="${m.id}">${H.icon('edit')}</button></li>`).join('')}</ul>` : '<p class="small muted">No medicines yet.</p>'}</div>
   <form data-form="ob">${nav(true)}</form>`;
  if (step === 3) body = `<h1>Health monitoring</h1><p class="muted">Choose what you want to track. Readings are entered manually unless a device is genuinely connected.</p>
   <form data-form="ob" class="card" style="margin-top:16px">${[['bp', 'Blood pressure'], ['glucose', 'Blood glucose'], ['hr', 'Heart rate'], ['spo2', 'Oxygen saturation'], ['weight', 'Weight'], ['sleep', 'Sleep'], ['activity', 'Activity'], ['symptoms', 'Symptoms']].map(([k, l]) => H.c.sw('mon_' + k, l, S.monitoring[k])).join('')}${nav(true)}</form>`;
  if (step === 4) { const L = S.lifestyle; body = `<h1>Lifestyle</h1><p class="muted">Used for your circadian plan and hydration reminders. All optional.</p>
   <form data-form="ob" class="card" style="margin-top:16px"><div class="grid g2">${H.c.field('bed', 'Typical bedtime', L.bed, 'time')}${H.c.field('wake', 'Typical wake time', L.wake, 'time')}
   ${H.c.select('chrono', 'Chronotype', [['early', 'Early bird'], ['intermediate', 'In between'], ['late', 'Night owl']], L.chrono)}${H.c.select('activity', 'Activity level', ['low', 'moderate', 'high'], L.activity)}
   ${H.c.field('exercise', 'Exercise preferences', L.exercise)}${H.c.field('hydration', 'Daily water goal (ml)', L.hydration, 'number')}
   ${H.c.select('caffeine', 'Caffeine habit', [['none', 'None'], ['morning', 'Mornings only'], ['all', 'Through the day']], L.caffeine)}${H.c.field('dietPref', 'Dietary preferences', L.diet)}</div>${nav(true)}</form>`; }
  if (step === 5) { const T = S.travelPrefs; body = `<h1>Travel preferences</h1>
   <form data-form="ob" class="card" style="margin-top:16px"><div class="grid g2">${H.c.select('frequency', 'How often do you travel?', ['occasional', 'frequent'], T.frequency)}${H.c.select('type', 'Usual travel type', ['leisure', 'business', 'family', 'adventure', 'long-stay'], T.type)}
   ${H.c.field('destinations', 'Common destinations', T.destinations)}${H.c.field('careLangs', 'Preferred languages for medical help', T.careLangs)}${H.c.field('accessibility', 'Accessibility needs', T.accessibility)}</div>
   <label class="f"><span>Adventure activities</span></label><div class="pills" style="margin-bottom:12px">${['Trekking', 'High altitude', 'Scuba', 'Remote travel', 'Cold environments', 'Heat environments'].map(a => `<label class="pill"><input type="checkbox" name="adv_${a}" ${T.adventure.includes(a) ? 'checked' : ''} style="margin-right:6px">${a}</label>`).join('')}</div>${nav(true)}</form>`; }
  return `<div class="ob">${head}<div style="margin-top:12px">${body}</div></div>`;
};
H.forms.ob = f => {
  const S = H.state; const step = S.profile.obStep || 0; const p = S.profile;
  if (step === 0) { Object.assign(p, { name: f.name, dob: f.dob, sex: f.sex, lang: f.lang, country: f.country, homeCity: f.homeCity, homeTz: f.homeTz, units: f.units }); if (f.ecName) { const c = S.contacts[0] || { id: H.uid('c'), primary: true }; Object.assign(c, { name: f.ecName, relation: f.ecRel, phone: f.ecPhone }); if (!S.contacts[0]) S.contacts.push(c); } }
  if (step === 1) { S.history.surgeries = (f.surgeries || '').split(',').map(x => x.trim()).filter(Boolean); S.history.devices = (f.devices || '').split(',').map(x => x.trim()).filter(Boolean); Object.assign(S.history, { restrictions: f.restrictions, mobility: f.mobility, diet: f.diet, pregnancy: f.pregnancy }); p.bloodGroup = f.bloodGroup; }
  if (step === 3) Object.keys(S.monitoring).forEach(k => S.monitoring[k] = !!f['mon_' + k]);
  if (step === 4) Object.assign(S.lifestyle, { bed: f.bed, wake: f.wake, chrono: f.chrono, activity: f.activity, exercise: f.exercise, hydration: f.hydration, caffeine: f.caffeine, diet: f.dietPref });
  if (step === 5) { Object.assign(S.travelPrefs, { frequency: f.frequency, type: f.type, destinations: f.destinations, careLangs: f.careLangs, accessibility: f.accessibility }); S.travelPrefs.adventure = ['Trekking', 'High altitude', 'Scuba', 'Remote travel', 'Cold environments', 'Heat environments'].filter(a => f['adv_' + a]); }
  if (step >= H.OB_STEPS.length - 1) return H.actions['ob-finish']();
  p.obStep = step + 1; H.save(); H.render(); window.scrollTo(0, 0);
};
H.actions['ob-next'] = () => { H.state.profile.obStep = Math.min(H.OB_STEPS.length - 1, (H.state.profile.obStep || 0) + 1); H.save(); H.render(); };
H.actions['ob-back'] = () => { H.state.profile.obStep = Math.max(0, (H.state.profile.obStep || 0) - 1); H.save(); H.render(); };
H.actions['ob-finish'] = () => { H.state.profile.onboarded = true; H.audit('Onboarding completed'); H.save(); H.toast('Profile created. You can complete skipped sections from Profile.'); H.go('home'); };
H.actions['quick-cond'] = el => { const n = el.dataset.name; const S = H.state; const i = S.conditions.findIndex(c => c.name === n); if (i >= 0) S.conditions.splice(i, 1); else S.conditions.push({ id: H.uid('d'), name: n, since: '', notes: '' }); H.save(); H.render(); };

</script>
<script>
/* Home dashboard, notifications, demo clock */
'use strict';
H.views.home = () => {
  const S = H.state; const ctx = H.context(); const now = H.now(); const t = ctx.trip; const st = ctx.status;
  const alerts = H.alerts(); const imp = alerts.filter(a => H.LEVELS.indexOf(a.level) >= 1);
  const first = (S.profile.name || '').split(' ')[0]; const hr = H.parts(now, ctx.tz).h;
  const greet = hr < 5 ? 'Good night' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  const destCountry = t ? t.stops[0].country : S.profile.country; const sceneKey = t && st !== 'past' ? H.g.keyFor(destCountry) : 'city';
  const sceneTz = st === 'active' ? ctx.tz : t && st === 'upcoming' ? H.trip.mainTz(t) : ctx.tz; const sh = H.parts(now, sceneTz).h; const night = sh < 6 || sh >= 19;
  let eyebrow = 'At home', big = '', sub = '';
  if (t && st === 'upcoming') { const d = H.trip.daysUntil(t); const out = H.trip.outbound(t); eyebrow = 'Next journey'; big = `<div class="count">${d}<span style="font-size:15px;font-weight:700"> days</span></div><div class="small" style="opacity:.9">to ${H.esc(t.stops[0].city)} · ${out ? H.esc(out.from.split(' (')[0]) + ' ✈ ' + H.esc(out.to.split(' (')[0]) : ''}</div>`; }
  if (st === 'active') { const day = H.daysBetween(t.stops[0].arrive, H.parts(now, ctx.tz).date) + 1; eyebrow = 'Travelling'; big = `<div class="count">Day ${day}<span style="font-size:15px;font-weight:700"> / ${H.trip.days(t)}</span></div><div class="small" style="opacity:.9">${H.esc(ctx.city)} · ${H.esc(t.name.split(' — ')[0])}</div>`; }
  if (st === 'in-transit') { eyebrow = 'In the air'; big = `<div class="count">✈</div><div class="small">${H.esc(ctx.flight.number)} · lands ${H.fmtTime(H.trip.arr(ctx.flight), ctx.flight.toTz)} ${H.tzShort(ctx.flight.toTz)}</div>`; }
  if (!t || st === 'past') big = `<div class="small" style="opacity:.9;max-width:220px">Wellness mode. Plan a trip to unlock your travel health plan.</div>`;
  const otherTz = ctx.tz !== H.homeTz() ? H.homeTz() : (t && st === 'upcoming' && H.trip.mainTz(t) !== H.homeTz() ? H.trip.mainTz(t) : null);
  const clocks = `<div class="row" style="gap:12px;flex-wrap:nowrap"><div style="text-align:center">${H.g.clock(now, ctx.tz, { dark: true, size: 54 })}<div style="font-size:10.5px;font-weight:700;opacity:.9">${H.tzShort(ctx.tz)} ${H.fmtTime(now, ctx.tz)}</div></div>${otherTz ? `<div style="text-align:center">${H.g.clock(now, otherTz, { dark: true, size: 54, accent: '#F4B942' })}<div style="font-size:10.5px;font-weight:700;opacity:.9">${H.tzShort(otherTz)} ${H.fmtTime(now, otherTz)}</div></div>` : ''}</div>`;
  const hero = `<div class="hero2"><div class="art">${H.g.scene(sceneKey, { night })}</div><div class="in" style="background:linear-gradient(180deg,rgba(11,29,51,.35),rgba(11,29,51,0) 60%,rgba(11,29,51,.45))"><div class="eyebrow">${eyebrow} ${t && st !== 'past' ? H.g.flag(destCountry) : ''}</div><h1>${greet}${first ? ', ' + H.esc(first) : ''}</h1>
    <div class="row between" style="margin-top:28px;align-items:flex-end;flex-wrap:nowrap"><div class="glass">${big}</div>${clocks}</div></div></div>`;
  const alertsHtml = imp.length ? `<div class="section" style="margin-top:14px"><div class="stack" style="--g:8px">${imp.slice(0, 2).map(H.g.compactAlert).join('')}</div>${alerts.length > 2 ? `<button class="btn ghost sm" data-act="all-alerts" style="margin-top:4px">All insights (${alerts.length})</button>` : ''}</div>` : `<div class="section" style="margin-top:14px"><div class="pill-alert" style="cursor:default"><span class="dot" style="background:var(--teal)"></span><span class="tt"><b>All clear</b><span>Nothing needs your attention right now</span></span></div></div>`;
  const qa = (href, cls, icon, label, act) => `<a class="qa" href="${href}" ${act ? `data-act="${act}"` : ''}><span class="q ${cls}">${H.icon(icon)}</span>${label}</a>`;
  const quick = `<div class="section"><div class="quad">${qa('#passport', 'navy', 'passport', 'Passport')}${S.allergies.length ? qa('#allergycard', 'coral', 'shield', 'Allergy card') : qa('#meds', 'teal', 'pill', 'Medicines')}${qa('#track', 'blue', 'plus', 'Log reading', 'add-reading')}${qa('#ai', 'violet', 'spark', 'Ask AI')}
    ${qa('#circadian', 'blue', 'moon', 'Jet lag')}${qa('#kit', 'amber', 'kit', 'Health kit')}${qa('#care', 'teal', 'hospital', 'Find care')}${qa('#symptoms', 'coral', 'alert', 'Symptom', 'new-symptom')}</div></div>`;
  // today rings
  const today = H.parts(now, ctx.tz).date; const sl = S.sleepLogs.filter(l => l.date <= today).sort((a, b) => a.date < b.date ? 1 : -1)[0];
  const hyd = S.hydration.find(h => h.date === today); const act = S.activityLogs.find(a => a.date === today); const goal = +S.lifestyle.hydration || 2000; const usual = (H.toMin(S.lifestyle.wake) - H.toMin(S.lifestyle.bed) + 1440) % 1440 / 60;
  const ringItem = (pct, color, center, label, sub, act2) => `<button class="ringwrap" style="background:none;border:0;cursor:pointer" ${act2}>${H.g.ring(pct, { size: 76, stroke: 8, color, center, fs: 14 })}<b>${label}</b><span>${sub}</span></button>`;
  const rings = `<div class="card section"><div class="sec-h" style="margin-bottom:8px"><span>Today</span><a href="#wellness">Recharge</a></div><div class="trio">
    ${ringItem((hyd ? hyd.ml : 0) / goal, '#1E88E5', ((hyd ? hyd.ml : 0) / 1000).toFixed(1) + 'L', 'Water', `goal ${(goal / 1000).toFixed(1)} L · tap +250`, 'data-act="water" data-ml="250"')}
    ${ringItem((act ? act.steps : 0) / 10000, '#14B8A6', act ? (act.steps / 1000).toFixed(1) + 'k' : '0', 'Steps', 'goal 10k', 'data-act="log-steps"')}
    ${ringItem((sl ? sl.hours : 0) / Math.max(usual, 7), '#7C6AE6', sl ? sl.hours + 'h' : '—', 'Sleep', `usual ${H.round(usual, 1)} h`, 'data-act="log-sleep"')}</div></div>`;
  // next dose with 24h dial
  const up = H.med.upcoming(6); const dayDoses = []; S.meds.filter(m => m.active !== false).forEach(m => H.med.schedule(m, H.zoned(today, '00:00', ctx.tz), H.zoned(today, '23:59', ctx.tz)).forEach(d => { const p = H.parts(d.at, ctx.tz); dayDoses.push({ min: p.h * 60 + p.m, done: !!H.med.logFor(m, d), risk: !!H.med.risk(m), label: m.name + ' ' + p.time }); }));
  const nx = up[0];
  const medCard = `<div class="card section"><div class="sec-h" style="margin-bottom:6px"><span>Medicines</span><a href="#meds">Schedule</a></div><div class="row" style="flex-wrap:nowrap;gap:14px">${H.g.dial(dayDoses, H.parts(now, ctx.tz).h * 60 + H.parts(now, ctx.tz).m, { size: 112 })}
    <div style="flex:1;min-width:0">${nx ? `<div class="small muted" style="font-weight:600">Next dose · ${nx.overdue ? '<span style="color:var(--coral-ink)">due now</span>' : 'in ' + H.fmtDur(H.hrs(nx.d.at - now))}</div><div style="font-family:var(--display);font-weight:800;font-size:18px;margin-top:2px">${H.esc(nx.m.name)}</div><div class="small">${H.esc(nx.m.dose)} ${H.esc(nx.m.unit)} · <b class="mono">${H.fmtTime(nx.d.at, ctx.tz)}</b> ${H.tzShort(ctx.tz)}${ctx.tz !== H.homeTz() ? ` <span class="muted">(${H.fmtTime(nx.d.at, H.homeTz())} home)</span>` : ''}</div>${nx.d.strategy.pendingReview ? '<span class="badge caution" style="margin-top:6px">Travel schedule: review pending</span>' : ''}
     <div class="row" style="margin-top:10px;gap:6px"><button class="btn sm teal" data-act="med-log" data-med="${nx.m.id}" data-due="${nx.d.at.toISOString()}" data-status="taken">${H.icon('check')}Taken</button><button class="btn sm sec" data-act="med-log" data-med="${nx.m.id}" data-due="${nx.d.at.toISOString()}" data-status="skipped">Skip</button></div>` : '<div class="small muted">No doses in the next 36 h.</div>'}</div></div>
    <div class="legend" style="margin-top:6px;font-size:11.5px"><span><i class="box" style="background:#1E88E5;border-radius:50%"></i>Due</span><span><i class="box" style="background:#F4B942;border-radius:50%"></i>Time-critical</span><span><i class="box" style="background:#14B8A6;border-radius:50%"></i>Taken</span></div></div>`;
  // vitals minis
  const vit = [['bp', 'Blood pressure', 'mmHg', '#1E88E5', [80, 120]], ['glucose', 'Glucose', 'mg/dL', '#0F9484', [70, 130]], ['spo2', 'SpO₂', '%', '#1E88E5', [95, 100]], ['hr', 'Heart rate', 'bpm', '#0F9484', [60, 100]]].filter(v => S.monitoring[v[0]]).slice(0, 2);
  const vitals = vit.length ? `<div class="section"><div class="sec-h"><span>Vitals</span><a href="#track">Trends</a></div><div class="duo">${vit.map(([k, l, u, c, ref]) => { const R = H.visible(S.readings).filter(r => r.type === k).sort((a, b) => new Date(a.at) - new Date(b.at)).slice(-14); const r = R[R.length - 1]; const lv = r ? H.readingLevel(r) : 'ok';
     return `<a class="mini" href="#track"><div class="k">${l}${lv !== 'ok' ? `<span class="dot lv-${lv}" style="width:8px;height:8px;border-radius:50%;display:inline-block"></span>` : ''}</div><div class="v mono">${r ? H.fmtReading(r) : '—'} <small>${u}</small></div><div class="f">normal ${H.REF[k].normal.split(' (')[0].split(';')[0]}</div>${H.g.spark(R.map(x => x.v1), c, ref)}</a>`; }).join('')}</div></div>` : '';
  // environment
  const envStop = ctx.stop || (t && st === 'upcoming' ? t.stops[0] : null);
  const ec = envStop ? { city: envStop.city, country: envStop.country, date: st === 'upcoming' ? envStop.arrive : H.parts(now, envStop.tz).date } : { city: ctx.city, country: ctx.country, date: today };
  const e = H.env(ec.city, ec.date, ec.country); const [aqiT] = H.aqiCat(e.aqi);
  const envCard = `<a class="card section" href="#env" style="display:block;text-decoration:none;color:inherit"><div class="sec-h" style="margin-bottom:4px"><span>${st === 'upcoming' ? 'On arrival in ' : ''}${H.esc(ec.city)}</span><span class="badge syn">synthetic</span></div><div class="row" style="flex-wrap:nowrap;justify-content:space-between"><div style="text-align:center">${H.g.gauge(e.aqi, 300, { w: 108 })}<div class="small muted" style="margin-top:-2px">AQI · ${aqiT}</div></div>
    <div class="trio" style="flex:1;margin-left:8px">${[['thermo', `${e.tMin}°/${e.tMax}°`, 'Temp'], ['sun', `${e.uv}`, 'UV'], ['drop', `${e.hum}%`, 'Humidity']].map(([i, v, l]) => `<div style="text-align:center"><div class="ico" style="margin:0 auto 4px;background:#F1F5F9">${H.icon(i)}</div><b class="mono" style="font-size:14px">${v}</b><div class="small muted">${l}</div></div>`).join('')}</div></div>${e.hazards.length ? `<div class="row" style="margin-top:8px;gap:6px">${e.hazards.map(h => `<span class="badge caution">${h}</span>`).join('')}</div>` : ''}</a>`;
  // prep / itinerary
  let ctxBlock = '';
  if (t && st === 'upcoming') { const cl = H.mergeChecklist(t).filter(i => !i.removed); const done = cl.filter(i => i.done).length; const nxt = cl.filter(i => !i.done).slice(0, 2);
    ctxBlock = `<div class="card section"><div class="sec-h" style="margin-bottom:8px"><span>Trip readiness</span><a href="#checklist">Checklist</a></div><div class="row" style="flex-wrap:nowrap;gap:14px">${H.g.ring(done / Math.max(1, cl.length), { size: 84, stroke: 9, color: '#14B8A6', center: Math.round(done / Math.max(1, cl.length) * 100) + '%' })}<div style="flex:1;min-width:0">${nxt.map(i => `<label class="check" style="padding:4px 0"><input type="checkbox" data-act="check-item" data-trip="${t.id}" data-id="${i.id}"><span class="small"><b>${H.esc(i.text.length > 58 ? i.text.slice(0, 56) + '…' : i.text)}</b>${i.due && i.due < today ? ' <span style="color:var(--coral-ink)">overdue</span>' : ''}</span></label>`).join('')}<div class="small muted">${done} of ${cl.length} done</div></div></div></div>`; }
  else if (t && st === 'active') { const acts = (t.activities || []).filter(a => a.date === today);
    ctxBlock = `<div class="card section"><div class="sec-h" style="margin-bottom:8px"><span>Today's plan</span><a href="#trip">Itinerary</a></div>${acts.length ? acts.map(a => `<div class="row" style="padding:6px 0;flex-wrap:nowrap"><span class="q ${a.type === 'food' ? 'amber' : a.type === 'hike' ? 'teal' : 'blue'}" style="width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center">${H.icon(a.type === 'food' ? 'food' : a.type === 'hike' || a.type === 'trek' ? 'mountain' : 'pin')}</span><div><b>${H.esc(a.name)}</b><div class="small muted">${a.time || ''}${a.type === 'food' && S.allergies.length ? ' · <a href="#allergycard">allergy card</a>' : ''}</div></div></div>`).join('') : '<p class="small muted" style="margin:0">Nothing planned — rest counts.</p>'}</div>`; }
  else ctxBlock = `<a class="card section" href="#newtrip" style="display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit"><span class="q blue" style="width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center">${H.icon('plus')}</span><div><b>Plan a trip</b><div class="small muted">Get your destination health plan</div></div></a>`;
  return `${hero}${alertsHtml}${quick}${ctxBlock}${medCard}${rings}${vitals}${envCard}${S.synthetic ? `<div class="section row" style="justify-content:center"><button class="chip syn" data-act="demo-clock">${H.icon('clock')} Synthetic demo · change demo clock</button></div>` : ''}`;
};
H.actions['all-alerts'] = () => { const al = H.alerts(); H.modal(`<div class="modal-head"><h2>All insights</h2><button class="iconbtn" data-act="close">${H.icon('x')}</button></div><div class="stack">${al.map(H.g.compactAlert).join('') || '<p class="muted">Nothing needs your attention.</p>'}</div>`, 'wide'); };
H.actions.dismiss = el => { H.state.dismissed[el.dataset.id] = new Date().toISOString(); H.save(); H.closeModal(); H.render(); H.toast('Dismissed — see Profile › Notifications for history'); };

/* notifications */
H.actions.notifs = () => {
  const N = H.state.notifications; N.forEach(n => n.read = true); H.save({ local: true }); H.ui.top();
  H.modal(`<div class="modal-head"><h2>Notifications</h2><button class="iconbtn" data-act="close">${H.icon('x')}</button></div>
   ${N.length ? `<ul class="list">${N.slice(0, 30).map(n => `<li><span class="badge ${n.level}">${H.LEVEL_LABEL[n.level] || n.level}</span><div class="grow"><div class="t">${H.esc(n.title)}</div><div class="s">${H.esc(n.body)} · ${H.ago(n.at)}</div></div>${n.route ? `<a class="btn sm ghost" href="#${n.route}" data-act="close">Open</a>` : ''}</li>`).join('')}</ul>` : '<p class="muted">No notifications yet. Medication reminders and important alerts appear here while HERMES is open.</p>'}
   <div class="row" style="margin-top:12px"><a class="btn sm sec" href="#notif" data-act="close">Notification settings</a>${N.length ? '<button class="btn sm ghost" data-act="clear-notifs">Clear all</button>' : ''}</div>`);
};
H.actions['clear-notifs'] = () => { H.state.notifications = []; H.save(); H.closeModal(); H.ui.top(); };

/* demo clock */
H.actions['demo-clock'] = () => {
  const k = H.state.demoKey || 'A'; const presets = H.DEMO.clocks[k] || H.DEMO.clocks.A; const cur = H.state.settings.demoClock;
  H.modal(`<div class="modal-head"><h2>Demo clock</h2><button class="iconbtn" data-act="close">${H.icon('x')}</button></div>
   <p class="muted small">Move the app's clock to see how HERMES changes before, during and after a journey. This only affects this demo view; all data stays synthetic.</p>
   <div class="stack" style="margin-top:12px">${presets.map((p, i) => `<button class="demo-tile" data-act="set-clock" data-i="${i}"><div class="ico">${H.icon('clock')}</div><div><b>${p.label}</b><div class="small muted">${p.at ? p.at.replace('T', ' ') + ' ' + H.tzShort(p.tz) : 'Use the real current time'}</div></div></button>`).join('')}</div>
   <form data-form="custom-clock" class="row" style="margin-top:12px"><input class="in" type="datetime-local" name="at" style="flex:1" required><select class="in" name="tz" style="width:auto">${H.c.tzOptions().map(z => `<option>${z}</option>`).join('')}</select><button class="btn sec">Set</button></form>
   ${cur ? `<p class="small muted" style="margin-top:10px">Currently pinned to ${H.fmtDT(H.now(), H.context().tz)} ${H.tzShort(H.context().tz)}.</p>` : ''}`);
};
H.actions['set-clock'] = el => { const k = H.state.demoKey || 'A'; const p = (H.DEMO.clocks[k] || H.DEMO.clocks.A)[+el.dataset.i]; H.state.settings.demoClock = p.at ? { at: H.zoned(p.at.slice(0, 10), p.at.slice(11, 16), p.tz).toISOString(), setAt: Date.now(), label: p.label } : null; H.save({ local: true }); H.closeModal(); H.toast(p.at ? 'Demo clock: ' + p.label : 'Using real time'); H.render(); };
H.forms['custom-clock'] = f => { H.state.settings.demoClock = { at: H.zoned(f.at.slice(0, 10), f.at.slice(11, 16), f.tz).toISOString(), setAt: Date.now(), label: 'Custom' }; H.save({ local: true }); H.closeModal(); H.render(); };

/* quick logging used across screens */
H.actions.water = el => { const d = H.parts(H.now(), H.context().tz).date; let h = H.state.hydration.find(x => x.date === d); if (!h) { h = { id: H.uid('h'), date: d, ml: 0, source: 'manual' }; H.state.hydration.push(h); } h.ml += +el.dataset.ml; h.source = 'manual'; H.save(); H.toast(`Water: ${(h.ml / 1000).toFixed(2)} L today`); H.render(); };
H.actions['log-sleep'] = () => H.modal(`<div class="modal-head"><h2>Log sleep</h2><button class="iconbtn" data-act="close">${H.icon('x')}</button></div><form data-form="sleep"><div class="grid g2">${H.c.field('date', 'Night ending (date)', H.parts(H.now(), H.context().tz).date, 'date')}${H.c.field('hours', 'Hours slept', '', 'number', 'step="0.25" min="0" max="16" required')}${H.c.select('quality', 'Quality', ['good', 'fair', 'poor'], 'fair')}</div><button class="btn">Save</button></form>`);
H.forms.sleep = f => { const S = H.state; S.sleepLogs = S.sleepLogs.filter(l => l.date !== f.date); S.sleepLogs.push({ id: H.uid('s'), date: f.date, hours: +f.hours, quality: f.quality, source: 'manual' }); H.save(); H.closeModal(); H.toast('Sleep logged'); H.render(); };
H.actions['log-steps'] = () => H.modal(`<div class="modal-head"><h2>Log steps</h2><button class="iconbtn" data-act="close">${H.icon('x')}</button></div><form data-form="steps">${H.c.field('date', 'Date', H.parts(H.now(), H.context().tz).date, 'date')}${H.c.field('steps', 'Steps', '', 'number', 'min="0" required')}<button class="btn">Save</button></form>`);
H.forms.steps = f => { const S = H.state; S.activityLogs = S.activityLogs.filter(l => l.date !== f.date); S.activityLogs.push({ id: H.uid('ac'), date: f.date, steps: +f.steps, source: 'manual' }); H.save(); H.closeModal(); H.render(); };

</script>
<script>
/* My Journey: trips, planner, timeline, checklist, destination health, environment, circadian, kit, healthcare finder */
'use strict';
const fd = d => H.fmtDate(new Date(d + 'T12:00:00Z'), 'UTC', { weekday: 'short', day: 'numeric', month: 'short' });

H.views.journey = () => {
  const ts = H.trip.sorted(); const now = H.now();
  const card = t => { const st = H.trip.status(t, now); const out = H.trip.outbound(t); const sh = out ? H.trip.shiftHours(out.fromTz, out.toTz, H.trip.dep(out)) : 0; const cl = (t.checklist || []).filter(i => !i.removed); const done = cl.filter(i => i.done).length; const d = H.trip.daysUntil(t);
    return `<div class="trip2 section" style="margin-top:12px"><div class="art">${H.g.scene(H.g.keyFor(t.stops[0].country))}<div style="position:absolute;left:14px;top:12px" class="row"><span class="badge ${st === 'active' || st === 'in-transit' ? 'ok' : st === 'upcoming' ? 'info' : ''}">${st === 'upcoming' ? 'In ' + H.plural(d, 'day') : st === 'in-transit' ? 'In transit' : st[0].toUpperCase() + st.slice(1)}</span>${t.synthetic ? '<span class="badge syn">synthetic</span>' : ''}</div></div>
     <div class="body"><div class="row between" style="flex-wrap:nowrap"><div style="min-width:0"><h2 style="font-size:18px">${H.g.flag(t.stops[0].country)} ${H.esc(t.name)}</h2><div class="small muted">${fd(t.stops[0].arrive)} – ${fd(t.returnDate || t.stops[t.stops.length - 1].depart)}</div></div>${H.g.ring(done / Math.max(1, cl.length), { size: 48, stroke: 5, color: '#14B8A6', center: Math.round(done / Math.max(1, cl.length) * 100) + '%', fs: 11 })}</div>
     <div class="chipline" style="margin-top:10px">${[[H.icon('clock'), H.fmtDur(Math.abs(sh)) + (sh > 0 ? ' east' : sh < 0 ? ' west' : '')], [H.icon('cal'), H.plural(H.trip.days(t), 'day')], [H.icon('mountain'), H.trip.maxAlt(t).toLocaleString() + ' m'], [H.icon('pin'), H.plural([...new Set(t.stops.map(s => s.city))].length, 'place')]].map(([i, v]) => `<span class="chip">${i}<b>${v}</b></span>`).join('')}</div>
     <div class="row" style="margin-top:12px"><button class="btn sm" data-act="open-trip" data-id="${t.id}">Open trip</button><button class="btn sm sec" data-act="edit-trip" data-id="${t.id}">${H.icon('edit')}Edit</button></div></div></div>`; };
  const qa = (r, cls, i, l) => `<a class="qa" href="#${r}"><span class="q ${cls}">${H.icon(i)}</span>${l}</a>`;
  return `<div class="row between" style="margin:6px 0 4px"><h1>My Journey</h1><a class="btn sm" href="#newtrip">${H.icon('plus')}New trip</a></div>` +
    (ts.length ? ts.map(card).join('') : H.c.empty('No trips yet', 'Add a trip for destination health, medicine timing, jet lag and a personalised kit.', `<a class="btn" href="#newtrip">Plan a trip</a>`)) +
    `<div class="section card"><div class="sec-h" style="margin-bottom:14px"><span>Travel tools</span></div><div class="quad" style="row-gap:16px">${qa('disease', 'coral', 'bug', 'Destination')}${qa('env', 'teal', 'leaf', 'Environment')}${qa('circadian', 'violet', 'moon', 'Jet lag')}${qa('checklist', 'blue', 'list', 'Checklist')}${qa('kit', 'amber', 'kit', 'Health kit')}${qa('care', 'teal', 'hospital', 'Find care')}${qa('meds', 'blue', 'pill', 'Meds & time')}${qa('allergy', 'coral', 'shield', 'Food allergy')}</div></div>`;
};
H.actions['open-trip'] = el => { H.state.activeTripId = el.dataset.id; H.save({ local: true }); H.go('trip'); };
H.actions['edit-trip'] = el => { H.param.draft = H.clone(H.trip.get(el.dataset.id)); H.go('newtrip'); };
H.change = H.change || {};
H.change['pick-trip'] = el => { H.state.activeTripId = el.value; H.save({ local: true }); H.render(); };

/* ---------- create / edit trip ---------- */
H.blankTrip = () => { const p = H.state.profile; const d = H.addDays(H.parts(H.now(), 'UTC').date, 30); return { id: null, name: '', mode: 'Air', origin: { country: p.country || 'India', city: p.homeCity || 'Delhi', tz: p.homeTz }, returnDate: H.addDays(d, 7), flights: [{ id: H.uid('f'), number: '', from: '', fromTz: p.homeTz, to: '', toTz: 'Asia/Tokyo', depDate: d, depTime: '09:00', arrDate: d, arrTime: '17:00' }], stops: [{ id: H.uid('s'), country: 'Japan', city: 'Tokyo', tz: 'Asia/Tokyo', arrive: d, depart: H.addDays(d, 7), alt: 40, accommodation: '' }], activities: [] }; };
H.views.newtrip = () => {
  const D = H.param.draft || (H.param.draft = H.blankTrip()); const tzs = H.c.tzOptions(); const countries = [...H.countryNames(), 'Other'];
  const allCities = Object.entries(H.COUNTRIES).flatMap(([cn, c]) => Object.keys(c.cities));
  const tzSel = (n, v) => `<select class="in" name="${n}">${tzs.map(z => `<option ${z === v ? 'selected' : ''}>${z}</option>`).join('')}</select>`;
  return H.c.ph(D.id ? 'Edit trip' : 'Plan a trip', 'Add destinations, flights (including transits) and activities. HERMES uses these for timing, environment and risk.', 'My Journey', '', ['journey', 'My Journey']) +
  `<datalist id="cities">${allCities.map(c => `<option value="${c}">`).join('')}</datalist>
  <form data-form="trip" id="tripform" class="stack">
   <div class="card"><h3>Trip</h3><div class="grid g3">${H.c.field('name', 'Trip name', D.name, 'text', 'required placeholder="e.g. Japan in winter"')}${H.c.select('mode', 'Travel mode', ['Air', 'Air + rail', 'Air + trek', 'Road', 'Sea'], D.mode)}${H.c.field('returnDate', 'Return date', D.returnDate, 'date', 'required')}
   ${H.c.select('oCountry', 'Departure country', countries.filter(c => c !== 'Other'), D.origin.country)}${H.c.field('oCity', 'Departure city', D.origin.city, 'text', 'list="cities" required')}<label class="f"><span>Departure time zone</span>${tzSel('oTz', D.origin.tz)}</label></div></div>
   <div class="card"><div class="card-head"><h3>Destinations & stays</h3><button type="button" class="btn sm sec" data-act="trip-row" data-kind="stops">${H.icon('plus')}Add stop</button></div>
    ${D.stops.map((s, i) => `<div class="grid g4" style="gap:10px;padding:10px 0;border-top:${i ? '1px solid var(--border)' : '0'}">
     ${H.c.select('s_country_' + i, 'Country', countries, H.COUNTRIES[s.country] ? s.country : 'Other', `data-change="stop-country" data-i="${i}"`)}${!H.COUNTRIES[s.country] ? H.c.field('s_countryX_' + i, 'Country name', s.country) : ''}${H.c.field('s_city_' + i, 'City / area', s.city, 'text', 'list="cities" required')}
     ${H.c.field('s_arrive_' + i, 'Arrive', s.arrive, 'date', 'required')}${H.c.field('s_depart_' + i, 'Leave', s.depart, 'date', 'required')}
     <label class="f"><span>Time zone</span>${tzSel('s_tz_' + i, s.tz)}</label>${H.c.field('s_alt_' + i, 'Sleeping altitude (m)', s.alt, 'number', 'min="0"')}${H.c.field('s_acc_' + i, 'Accommodation', s.accommodation)}
     <div style="display:flex;align-items:flex-end;padding-bottom:12px">${D.stops.length > 1 ? `<button type="button" class="btn sm ghost" data-act="trip-del" data-kind="stops" data-i="${i}">${H.icon('trash')}Remove</button>` : ''}</div></div>`).join('')}</div>
   <div class="card"><div class="card-head"><h3>Flights & transits</h3><button type="button" class="btn sm sec" data-act="trip-row" data-kind="flights">${H.icon('plus')}Add flight / leg</button></div>
    <p class="small muted">Add each leg separately; a layover is the gap between two legs. Times are local to each airport.</p>
    ${D.flights.map((f, i) => `<div class="grid g4" style="gap:10px;padding:10px 0;border-top:1px solid var(--border)">
     ${H.c.field('f_number_' + i, 'Flight', f.number, 'text', 'placeholder="e.g. AI 306"')}${H.c.field('f_from_' + i, 'From', f.from, 'text', 'required')}<label class="f"><span>From time zone</span>${tzSel('f_fromTz_' + i, f.fromTz)}</label>${H.c.field('f_to_' + i, 'To', f.to, 'text', 'required')}
     <label class="f"><span>To time zone</span>${tzSel('f_toTz_' + i, f.toTz)}</label>${H.c.field('f_depDate_' + i, 'Departure date', f.depDate, 'date', 'required')}${H.c.field('f_depTime_' + i, 'Departure (local)', f.depTime, 'time', 'required')}<div></div>
     ${H.c.field('f_arrDate_' + i, 'Arrival date', f.arrDate, 'date', 'required')}${H.c.field('f_arrTime_' + i, 'Arrival (local)', f.arrTime, 'time', 'required')}<div class="small muted" style="padding-top:28px">${(() => { try { const d = H.zoned(f.depDate, f.depTime, f.fromTz), a = H.zoned(f.arrDate, f.arrTime, f.toTz); return `Duration ${H.fmtDur(H.hrs(a - d))} · clock change ${H.fmtDur(H.trip.shiftHours(f.fromTz, f.toTz, d))}`; } catch (e) { return ''; } })()}</div>
     <div style="display:flex;align-items:flex-end;padding-bottom:12px"><button type="button" class="btn sm ghost" data-act="trip-del" data-kind="flights" data-i="${i}">${H.icon('trash')}Remove</button></div></div>`).join('') || '<p class="small muted">No flights (overland trip).</p>'}</div>
   <div class="card"><div class="card-head"><h3>Activities</h3><button type="button" class="btn sm sec" data-act="trip-row" data-kind="activities">${H.icon('plus')}Add activity</button></div>
    ${D.activities.map((a, i) => `<div class="grid g4" style="gap:10px;padding:8px 0;border-top:1px solid var(--border)">${H.c.field('a_name_' + i, 'Activity', a.name, 'text', 'required')}${H.c.field('a_date_' + i, 'Date', a.date, 'date', 'required')}${H.c.select('a_type_' + i, 'Type', ['walk', 'food', 'hike', 'trek', 'scuba', 'wellness', 'business', 'other'], a.type)}${H.c.select('a_int_' + i, 'Intensity', ['light', 'moderate', 'vigorous'], a.intensity || 'moderate')}${H.c.field('a_time_' + i, 'Time', a.time, 'time')}${H.c.field('a_alt_' + i, 'Max altitude (m)', a.alt || '', 'number')}<div style="display:flex;align-items:flex-end;padding-bottom:12px"><button type="button" class="btn sm ghost" data-act="trip-del" data-kind="activities" data-i="${i}">${H.icon('trash')}</button></div></div>`).join('') || '<p class="small muted">Optional — activities sharpen kit, altitude and food-allergy guidance.</p>'}</div>
   <div class="err" id="err"></div>
   <div class="row"><button class="btn lg">${D.id ? 'Save changes' : 'Create trip & assess'}</button><a class="btn lg sec" href="#journey" data-act="trip-cancel">Cancel</a>${D.id ? `<button type="button" class="btn lg ghost" style="color:var(--coral-ink)" data-act="trip-delete" data-id="${D.id}">Delete trip</button>` : ''}</div>
  </form>`;
};
H.readTripForm = () => {
  const form = document.getElementById('tripform'); if (!form) return H.param.draft; const f = Object.fromEntries(new FormData(form).entries()); const D = H.param.draft;
  D.name = f.name; D.mode = f.mode; D.returnDate = f.returnDate; D.origin = { country: f.oCountry, city: f.oCity, tz: f.oTz };
  D.stops = D.stops.map((s, i) => { const cn = f['s_country_' + i] === 'Other' ? (f['s_countryX_' + i] || 'Other') : f['s_country_' + i]; return Object.assign(s, { country: cn, city: f['s_city_' + i], arrive: f['s_arrive_' + i], depart: f['s_depart_' + i], tz: f['s_tz_' + i], alt: +f['s_alt_' + i] || 0, accommodation: f['s_acc_' + i] }); });
  D.flights = D.flights.map((x, i) => Object.assign(x, { number: f['f_number_' + i], from: f['f_from_' + i], fromTz: f['f_fromTz_' + i], to: f['f_to_' + i], toTz: f['f_toTz_' + i], depDate: f['f_depDate_' + i], depTime: f['f_depTime_' + i], arrDate: f['f_arrDate_' + i], arrTime: f['f_arrTime_' + i] }));
  D.activities = D.activities.map((a, i) => Object.assign(a, { name: f['a_name_' + i], date: f['a_date_' + i], type: f['a_type_' + i], intensity: f['a_int_' + i], time: f['a_time_' + i], alt: +f['a_alt_' + i] || 0 }));
  return D;
};
H.actions['trip-row'] = el => { const D = H.readTripForm(); const k = el.dataset.kind; const last = D.stops[D.stops.length - 1];
  if (k === 'stops') D.stops.push({ id: H.uid('s'), country: last.country, city: '', tz: last.tz, arrive: last.depart, depart: H.addDays(last.depart, 2), alt: 0, accommodation: '' });
  if (k === 'flights') { const lf = D.flights[D.flights.length - 1]; D.flights.push({ id: H.uid('f'), number: '', from: lf ? lf.to : '', fromTz: lf ? lf.toTz : D.origin.tz, to: '', toTz: D.origin.tz, depDate: D.returnDate, depTime: '10:00', arrDate: D.returnDate, arrTime: '18:00' }); }
  if (k === 'activities') D.activities.push({ id: H.uid('a'), name: '', date: D.stops[0].arrive, type: 'walk', intensity: 'moderate', time: '', alt: 0, stopId: D.stops[0].id });
  H.render(); };
H.actions['trip-del'] = el => { const D = H.readTripForm(); D[el.dataset.kind].splice(+el.dataset.i, 1); H.render(); };
H.actions['trip-cancel'] = () => { H.param.draft = null; };
H.change['stop-country'] = el => { const D = H.readTripForm(); const i = +el.dataset.i; const c = H.COUNTRIES[el.value]; if (c) { D.stops[i].country = el.value; D.stops[i].tz = c.tz; const first = Object.keys(c.cities)[0]; D.stops[i].city = first; D.stops[i].alt = c.cities[first].alt; } else D.stops[i].country = ''; H.render(); };
H.forms.trip = () => {
  const D = H.readTripForm(); const e = m => { document.getElementById('err').textContent = m; };
  for (const s of D.stops) { if (s.depart < s.arrive) return e(`${s.city}: leave date is before arrival.`); const ci = H.cityInfo(s.country, s.city); if (ci && !s.alt) s.alt = ci.alt; }
  for (const f of D.flights) { if (H.zoned(f.arrDate, f.arrTime, f.toTz) <= H.zoned(f.depDate, f.depTime, f.fromTz)) return e(`Flight ${f.number || f.from + '→' + f.to}: arrival is not after departure (check dates and time zones).`); }
  D.activities.forEach(a => { const s = D.stops.find(s => a.date >= s.arrive && a.date <= s.depart); a.stopId = s ? s.id : D.stops[0].id; });
  const S = H.state; let t;
  if (D.id) { t = H.trip.get(D.id); Object.assign(t, D); H.audit('Trip edited', t.name); }
  else { t = Object.assign(D, { id: H.uid('t'), createdAt: new Date().toISOString(), checklist: [], kit: [] }); S.trips.push(t); H.audit('Trip created', t.name); H.notify('info', 'Trip assessed', `${t.name}: destination health, medication timing and kit are ready.`, 'trip', 'milestone'); }
  H.mergeChecklist(t); H.mergeKit(t); S.activeTripId = t.id; H.param.draft = null; H.save(); H.toast('Trip saved — travel health assessment updated'); H.go('trip');
};
H.actions['trip-delete'] = el => { H.modal(`<h2>Delete this trip?</h2><p class="muted">Its checklist, kit and travel medication plans will be removed. Health logs are kept.</p><div class="row"><button class="btn danger" data-act="trip-delete-yes" data-id="${el.dataset.id}">Delete</button><button class="btn sec" data-act="close">Cancel</button></div>`); };
H.actions['trip-delete-yes'] = el => { const S = H.state; S.trips = S.trips.filter(t => t.id !== el.dataset.id); delete S.travelPlans[el.dataset.id]; if (S.activeTripId === el.dataset.id) S.activeTripId = null; H.param.draft = null; H.audit('Trip deleted'); H.save(); H.closeModal(); H.go('journey'); };

/* ---------- trip details + timeline ---------- */
H.tripTimeline = t => {
  const ev = []; const S = H.state;
  (t.checklist || []).filter(i => i.due && !i.done && !i.removed).slice(0, 6).forEach(i => ev.push({ at: H.zoned(i.due, '09:00', t.origin.tz), tz: t.origin.tz, kind: 'deadline', t: 'Preparation deadline', s: i.text }));
  H.trip.flights(t).forEach(f => { const d = H.trip.dep(f), a = H.trip.arr(f); const sh = H.trip.shiftHours(f.fromTz, f.toTz, d);
    ev.push({ at: d, tz: f.fromTz, kind: 'flight', t: `Depart ${f.from}`, s: `${f.number || 'Flight'} · ${H.fmtDur(H.hrs(a - d))} flight` });
    if (Math.abs(sh) >= 0.5) ev.push({ at: new Date(a.getTime() - 1), tz: f.toTz, kind: 'tz', t: `Clock change: ${sh > 0 ? '+' : '−'}${H.fmtDur(Math.abs(sh))}`, s: `${H.tzShort(f.fromTz)} → ${H.tzShort(f.toTz)}. Your watch jumps ${sh > 0 ? 'forward' : 'back'}; your body clock will not.` });
    ev.push({ at: a, tz: f.toTz, kind: 'flight', t: `Arrive ${f.to}`, s: 'Local time shown.' }); });
  const out = H.trip.outbound(t);
  if (out) S.meds.filter(m => H.med.times(m).length).forEach(m => { const st = H.med.strategy(m, t); const ds = H.med.doses(m, t, st.mode, H.trip.arr(out), new Date(H.trip.arr(out).getTime() + 26 * 3600000), st.plan && H.med.approved(st.plan) ? st.plan : null).slice(0, 1); ds.forEach(d => ev.push({ at: d.at, tz: H.trip.mainTz(t), kind: 'med', t: `First dose after arrival: ${m.name}`, s: `${H.fmtTime(d.at, H.trip.mainTz(t))} local = ${H.fmtTime(d.at, t.origin.tz)} ${H.tzShort(t.origin.tz)} · ${st.reason}` })); });
  const cp = H.circ.plan(t); if (cp) { const d0 = cp.days.find(d => d.kind === 'dest'); if (d0) ev.push({ at: H.zoned(d0.date, H.fromMin(d0.sleep[0]), d0.tz), tz: d0.tz, kind: 'sleep', t: 'Sleep plan: first night', s: `Aim for bed ~${H.fromMin(d0.sleep[0])}, wake ~${H.fromMin(d0.sleep[1])} local · est. ${H.plural(cp.adaptDays, 'day')} to adapt` }); }
  t.stops.forEach((s, i) => { if (i) ev.push({ at: H.zoned(s.arrive, '15:00', s.tz), tz: s.tz, kind: 'stop', t: `Arrive ${s.city}`, s: `${s.accommodation || ''}${s.alt ? ' · ' + s.alt.toLocaleString() + ' m' : ''}` }); });
  (t.activities || []).forEach(a => { const s = H.byId(t.stops, a.stopId) || t.stops[0]; ev.push({ at: H.zoned(a.date, a.time || '10:00', s.tz), tz: s.tz, kind: 'act', t: a.name, s: `${a.type}${a.intensity ? ' · ' + a.intensity : ''}${a.alt ? ' · up to ' + a.alt.toLocaleString() + ' m' : ''}` }); });
  for (let d = t.stops[0].arrive; d <= (t.returnDate || t.stops[t.stops.length - 1].depart); d = H.addDays(d, 2)) { const s = t.stops.find(x => d >= x.arrive && d < x.depart) || t.stops[0]; ev.push({ at: H.zoned(d, '08:00', s.tz), tz: s.tz, kind: 'check', t: 'Health check-in', s: [S.monitoring.bp && 'BP', S.monitoring.glucose && 'glucose', S.monitoring.spo2 && 'SpO₂', 'sleep', 'symptoms'].filter(Boolean).join(', ') }); }
  return ev.sort((a, b) => a.at - b.at);
};
H.views.trip = () => {
  const t = H.trip.focus() || H.trip.get(H.state.activeTripId); if (!t) return H.c.empty('No trip selected', 'Create a trip first.', '<a class="btn" href="#newtrip">Plan a trip</a>');
  const st = H.trip.status(t); const ev = H.tripTimeline(t); const out = H.trip.outbound(t); const sh = out ? H.trip.shiftHours(out.fromTz, out.toTz, H.trip.dep(out)) : 0;
  const al = H.alerts().filter(a => a.cat !== 'health');
  const cls = { flight: 'flight', tz: 'tz', med: 'med', deadline: 'deadline' };
  return H.c.ph(H.esc(t.name), `${H.esc(t.origin.city)} → ${[...new Set(t.stops.map(s => s.city))].map(H.esc).join(' → ')} · ${fd(t.stops[0].arrive)} – ${fd(t.returnDate)}`, `Trip · ${st}`, `${H.c.tripPicker()}<button class="btn sec" data-act="edit-trip" data-id="${t.id}">${H.icon('edit')}Edit</button>`, ['journey', 'My Journey']) +
   `<div class="grid g4"><div class="card stat"><div class="k">Time zones</div><div class="v">${H.fmtDur(Math.abs(sh))}</div><div class="b">${sh > 0 ? 'East' : sh < 0 ? 'West' : 'None'} · ${H.tzShort(t.origin.tz)} → ${H.tzShort(H.trip.mainTz(t))}</div></div>
    <div class="card stat"><div class="k">Duration</div><div class="v">${H.trip.days(t)}<small> days</small></div><div class="b">Medicine supply: ${H.med.supplyDays(t)} days</div></div>
    <div class="card stat"><div class="k">Max altitude</div><div class="v">${H.trip.maxAlt(t).toLocaleString()}<small> m</small></div><div class="b">${H.trip.maxAlt(t) > 2500 ? 'Altitude precautions' : 'No altitude risk'}</div></div>
    <div class="card stat"><div class="k">Insights</div><div class="v">${al.length}</div><div class="b">${al.filter(a => H.LEVELS.indexOf(a.level) >= 2).length} need attention</div></div></div>
   <div class="grid g2 section" style="align-items:start"><div class="card"><div class="card-head"><h3>Trip timeline</h3><span class="small muted">times shown in local time of each place</span></div><div class="tl">${ev.map(e => `<div class="tl-i ${cls[e.kind] || ''}"><div class="when mono">${H.fmtDT(e.at, e.tz)} ${H.tzShort(e.tz)}</div><div style="font-weight:600">${H.esc(e.t)}</div><div class="small muted">${H.esc(e.s)}</div></div>`).join('')}</div></div>
   <div class="stack"><div class="card"><h3>Travel health assessment</h3>
    <ul class="list">${[['disease', 'bug', 'Destination advisories', H.trip.countries(t).map(c => H.COUNTRIES[c] && H.COUNTRIES[c].curated ? c + ': curated' : c + ': no curated data — check WHO/CDC').join(' · ')], ['meds', 'pill', 'Medication continuity', `${H.state.meds.filter(m => H.med.risk(m)).length} time-critical · ${H.state.meds.length} total`], ['env', 'leaf', 'Environment', t.stops.map(s => { const e = H.env(s.city, s.arrive, s.country); return `${s.city} ${e.tMin}–${e.tMax} °C, AQI ${e.aqi}`; }).filter((x, i, a) => a.indexOf(x) === i).slice(0, 2).join(' · ') + ' (synthetic)'], ['circadian', 'moon', 'Sleep & jet lag', Math.abs(sh) >= 2 ? `${H.fmtDur(Math.abs(sh))} shift — plan ready` : 'Minimal shift'], ['allergy', 'shield', 'Food allergy', H.state.allergies.filter(a => a.type === 'food').map(a => a.allergen).join(', ') || 'None recorded'], ['kit', 'kit', 'Travel kit', `${(t.kit || []).filter(k => !k.removed).length} items`]].map(([r, i, ti, s]) => `<li><div class="ico">${H.icon(i)}</div><div class="grow"><div class="t">${ti}</div><div class="s">${H.esc(s)}</div></div><a class="btn sm ghost" href="#${r}">${H.icon('right')}</a></li>`).join('')}</ul></div>
    ${al.slice(0, 4).map(H.g.compactAlert).join('')}</div></div>`;
};

/* ---------- checklist ---------- */
H.views.checklist = () => {
  const t = H.trip.focus(); if (!t) return H.c.empty('No trip', 'Create a trip to generate a preparation checklist.', '<a class="btn" href="#newtrip">Plan a trip</a>');
  const cl = H.mergeChecklist(t).filter(i => !i.removed); const cats = [...new Set(cl.map(i => i.cat))]; const today = H.parts(H.now(), t.origin.tz).date;
  return H.c.ph('Preparation checklist', `Generated from ${H.esc(t.name)}, your conditions, medicines, allergies and activities. Edit anything.`, 'My Journey', `${H.c.tripPicker()}<button class="btn sec" data-act="add-check">${H.icon('plus')}Add item</button>`, ['trip', 'Trip']) +
   `<div class="card"><div class="row between small"><b>${cl.filter(i => i.done).length} of ${cl.length} complete</b><span class="muted">Departure ${H.fmtDT(H.trip.start(t), t.origin.tz)}</span></div><div class="meter"><i style="width:${cl.filter(i => i.done).length / Math.max(1, cl.length) * 100}%"></i></div></div>` +
   cats.map(c => `<div class="card"><h3>${c}</h3><ul class="list">${cl.filter(i => i.cat === c).map(i => `<li class="${i.done ? 'done' : ''}"><input type="checkbox" ${i.done ? 'checked' : ''} data-act="check-item" data-trip="${t.id}" data-id="${i.id}" style="width:20px;height:20px;accent-color:var(--teal-ink)"><div class="grow"><div class="t" style="font-weight:500">${H.esc(i.text)}</div><div class="s">${i.due ? `Due ${fd(i.due)}${!i.done && i.due < today ? ' · <b style="color:var(--coral-ink)">overdue</b>' : ''}` : ''}${i.why ? ' · ' + H.esc(i.why) : ''}${i.src && H.SOURCES[i.src] ? ` · <a href="${H.SOURCES[i.src].url}" target="_blank" rel="noopener">${H.SOURCES[i.src].org}</a>` : ''}</div></div><button class="iconbtn" data-act="edit-check" data-id="${i.id}" title="Edit">${H.icon('edit')}</button><button class="iconbtn" data-act="del-check" data-id="${i.id}" title="Remove">${H.icon('trash')}</button></li>`).join('')}</ul></div>`).join('');
};
H.actions['check-item'] = el => { const t = H.trip.get(el.dataset.trip); const i = H.byId(t.checklist, el.dataset.id); i.done = !i.done; H.audit('Checklist updated', i.text); H.save(); H.render(); };
H.actions['del-check'] = el => { const t = H.trip.focus(); const i = H.byId(t.checklist, el.dataset.id); if (i.auto) i.removed = true; else t.checklist = t.checklist.filter(x => x !== i); H.save(); H.render(); };
H.actions['add-check'] = () => H.modal(`<div class="modal-head"><h2>Add checklist item</h2><button class="iconbtn" data-act="close">${H.icon('x')}</button></div><form data-form="check">${H.c.field('text', 'Item', '', 'text', 'required')}<div class="grid g2">${H.c.select('cat', 'Category', ['Medical', 'Medication', 'Documents', 'Allergy', 'Prevention', 'Packing', 'Healthcare', 'Wellness'], 'Packing')}${H.c.field('due', 'Due date', '', 'date')}</div><button class="btn">Add</button></form>`);
H.actions['edit-check'] = el => { const i = H.byId(H.trip.focus().checklist, el.dataset.id); H.modal(`<div class="modal-head"><h2>Edit item</h2><button class="iconbtn" data-act="close">${H.icon('x')}</button></div><form data-form="check"><input type="hidden" name="id" value="${i.id}">${H.c.field('text', 'Item', i.text, 'text', 'required')}<div class="grid g2">${H.c.select('cat', 'Category', ['Medical', 'Medication', 'Documents', 'Allergy', 'Prevention', 'Packing', 'Healthcare', 'Wellness'], i.cat)}${H.c.field('due', 'Due date', i.due || '', 'date')}</div><button class="btn">Save</button></form>`); };
H.forms.check = f => { const t = H.trip.focus(); if (f.id) { const i = H.byId(t.checklist, f.id); if (i.text !== f.text) i.textEdited = true; if (i.due !== f.due) i.dueEdited = true; Object.assign(i, { text: f.text, cat: f.cat, due: f.due || null }); } else t.checklist.push({ id: H.uid('k'), key: H.uid('k'), text: f.text, cat: f.cat, due: f.due || null, auto: false, done: false }); H.save(); H.closeModal(); H.render(); };

/* ---------- destination health ---------- */
H.views.disease = () => {
  const t = H.trip.focus(); const sel = H.param.country || (t ? H.trip.countries(t)[0] : 'Japan'); const c = H.COUNTRIES[sel]; const S = H.state;
  const picker = `<select class="in" style="width:auto" data-change="pick-country">${H.countryNames().filter(n => H.COUNTRIES[n].curated).map(n => `<option ${n === sel ? 'selected' : ''}>${n}</option>`).join('')}${c ? '' : `<option selected>${H.esc(sel)}</option>`}</select>`;
  if (!c || !c.curated) return H.c.ph('Destination health', '', 'My Journey', picker) + `<div class="note warn">HERMES has no curated, source-reviewed data for <b>${H.esc(sel)}</b>. It will not guess. Check <a href="${H.SOURCES.who_travel.url}" target="_blank" rel="noopener">WHO travel advice</a> and your national travel-health service, and consider a travel-medicine consultation.</div>`;
  const m = (H.now().getUTCMonth() + 1); const lv = { high: 'urgent', moderate: 'caution', low: 'info' };
  const exposures = t ? t.stops.filter(s => s.country === sel) : [];
  const indiv = [];
  if (S.conditions.length) indiv.push(`Book a travel-medicine or primary-care review 4–6 weeks before departure to discuss ${S.conditions.map(x => x.name.toLowerCase()).join(' and ')} on this trip.`);
  if (H.has.diabetes()) indiv.push('Diabetes: plan glucose monitoring, hypoglycaemia supplies, meal timing across time zones and a sick-day plan with your clinician.');
  if (H.has.resp()) indiv.push('Respiratory condition: bring your action plan and reliever; air quality and altitude matter more for you.');
  if (S.meds.some(x => H.med.risk(x))) indiv.push('You take time-critical medicines — get a written time-zone schedule from your prescriber or pharmacist.');
  if (S.history.pregnancy) indiv.push('Pregnancy: some vaccines and mosquito-borne infections (e.g. Zika) need individual advice.');
  if (c.malaria && c.malaria.risk && exposures.some(s => (c.malaria.cities || []).includes(s.city))) indiv.push(`Your itinerary includes ${exposures.filter(s => (c.malaria.cities || []).includes(s.city)).map(s => s.city).join(', ')} in a malaria-risk area — ask a clinician about malaria prevention medicine.`);
  if (t && H.trip.maxAlt(t) > 2500) indiv.push(`Your itinerary reaches ${H.trip.maxAlt(t).toLocaleString()} m — discuss altitude-illness prevention with a clinician.`);
  const supply = t ? H.med.supplyDays(t) : 0;
  return H.c.ph(`${sel}: destination health`, 'Curated from official sources, separated into what is required, what is recommended, and what needs individual clinical advice.', 'Destination health', picker, ['journey', 'My Journey']) +
   `<div class="note" style="margin-bottom:16px">HERMES does not claim any destination is "safe". These are reviewed summaries; follow the source links for the current advisory. ${H.c.src(['who_travel'])}</div>
   <div class="grid g3"><div class="card"><h4>1 · Mandatory entry requirements</h4><ul style="padding-left:18px;margin:8px 0">${c.entry.map(e => `<li>${H.esc(e.t)}</li>`).join('')}</ul>${H.c.src([...new Set(c.entry.map(e => e.src))])}</div>
    <div class="card"><h4>2 · Recommended prevention</h4><ul class="list">${c.vaccines.map(v => `<li><div class="grow"><div class="t" style="font-size:14px">${H.esc(v.name)}</div><div class="s">${H.esc(v.who)}</div></div></li>`).join('')}</ul>${H.c.src([...new Set(c.vaccines.map(v => v.src))])}</div>
    <div class="card"><h4>3 · Individual clinical advice</h4>${indiv.length ? `<ul style="padding-left:18px;margin:8px 0">${indiv.map(x => `<li style="margin-bottom:6px">${H.esc(x)}</li>`).join('')}</ul>` : '<p class="small muted">Add your health profile for personalised items.</p>'}<p class="small muted">Generated from your profile — a clinician confirms what applies to you.</p></div></div>
   <div class="section"><h2>Disease risks</h2><div class="grid g2">${c.diseases.map(d => `<details class="acc" style="margin:0"><summary><span class="dot lv-${lv[d.level]}" style="width:10px;height:10px;border-radius:50%"></span>${H.esc(d.name)}<span class="badge ${lv[d.level]}" style="margin-left:6px">${d.level}</span></summary><div class="ac"><p class="small" style="margin:0 0 6px">${H.esc(d.note)}</p><div class="small muted">${d.season ? 'Season: ' + d.season.map(x => ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][x]).join(', ') + (d.season.includes(m) ? ' · <b>in season now</b>' : '') : 'Year-round'}</div>${H.c.src([d.src])}</div></details>`).join('')}
    <div class="card"><h3>Malaria</h3><p class="small">${H.esc(c.malaria.note)}</p>${H.c.src([c.malaria.src])}</div><div class="card"><h3>Dengue</h3><p class="small">${H.esc(c.dengue.note)}</p>${H.c.src([c.dengue.src])}</div></div></div>
   <div class="grid g2 section"><div class="card"><h3>Food & water</h3><p class="small">${H.esc(c.foodWater)}</p>${(c.dengue.risk || c.malaria.risk) ? '<h3 style="margin-top:12px">Mosquito & tick prevention</h3><p class="small">Use EPA-registered repellent (DEET, picaridin), cover up at dawn and dusk (malaria) and through the day (dengue), and sleep under screens or nets where needed.</p>' : '<h3 style="margin-top:12px">Insects & animals</h3><p class="small">Use repellent when hiking in warmer months; avoid touching stray or wild animals and seek care promptly after any bite or scratch.</p>'}</div>
    <div class="card"><h3>Bringing medicines into ${sel}</h3><p class="small">${H.esc(c.medImport.summary)}</p>${c.medImport.controlled ? `<p class="small">${H.esc(c.medImport.controlled)}</p>` : ''}${t && c.medImport.limitDays ? `<div class="note ${supply > c.medImport.limitDays ? 'warn' : 'safe'}">Your planned supply: <b>${supply} days</b> (trip + 7 spare) · allowance ${c.medImport.limitDays} days${supply > c.medImport.limitDays ? ` → ${c.medImport.permit} needed, or confirm supply with your prescriber.` : ' → within allowance.'}</div>` : ''}${H.c.src(c.medImport.src)}</div></div>
   <div class="grid g2 section"><div class="card"><h3>Healthcare in ${sel}</h3><p class="small">${H.esc(c.healthcare)}</p><a class="btn sm sec" href="#care">Healthcare finder</a></div>
    <div class="card"><h3>Emergency numbers</h3><ul class="list">${c.emergency.map(e => `<li><div class="grow"><div class="t">${H.esc(e.label)}</div></div><a class="btn sm danger mono" href="tel:${e.num.replace(/[^0-9+#]/g, '')}">${e.num}</a></li>`).join('')}</ul><div class="small muted">${c.emStatus === 'verified' ? 'Verified against' : 'Compiled by HERMES — confirm with'} source on ${fd(c.emVerified)}.</div>${H.c.src([c.emSource])}</div></div>`;
};
H.change['pick-country'] = el => { H.param.country = el.value; H.render(); };

/* ---------- environmental intelligence ---------- */
H.views.env = () => {
  const t = H.trip.focus(); const ctx = H.context(); const S = H.state;
  const stops = t ? t.stops : [{ city: ctx.city, country: ctx.country, arrive: H.parts(H.now(), ctx.tz).date, depart: H.addDays(H.parts(H.now(), ctx.tz).date, 7), tz: ctx.tz }];
  const al = H.alerts().filter(a => a.cat === 'env' || a.cat === 'sleep');
  const rows = []; stops.forEach(s => { for (let d = s.arrive; d < s.depart || (d === s.arrive); d = H.addDays(d, 1)) { rows.push({ s, d, e: H.env(s.city, d, s.country) }); if (rows.length > 30) break; } });
  const sl = S.sleepLogs.filter(l => l.date <= H.parts(H.now(), ctx.tz).date).sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 3);
  return H.c.ph('Environmental intelligence', 'Your destination\'s environment, connected to your conditions, medicines and recent sleep and activity.', 'My Journey', H.c.tripPicker(), ['journey', 'My Journey']) +
   `<div class="card"><div class="row between"><div><h3>Data provider</h3><p class="small muted" style="margin:0">Active: <b>${H.envProviders.synthetic.name}</b> — realistic seasonal values for demonstration. A live provider (weather + air quality API) plugs into the same interface; this page cannot reach outside APIs, so none is connected.</p></div><span class="badge syn">Synthetic — not live</span></div></div>
   <div class="section"><h2>Personal insights</h2>${al.length ? `<div class="stack">${al.map(H.g.compactAlert).join('')}</div>` : '<div class="note safe">No environmental concerns detected for your profile and itinerary. HERMES checks heat, cold, air quality, UV, altitude and fatigue against your conditions and medicines.</div>'}</div>
   <div class="section"><h2>Day by day</h2><div class="card scroll-x"><table class="t"><thead><tr><th>Date</th><th>Place</th><th>Temp °C</th><th>Heat index</th><th>Humidity</th><th>AQI <span style="text-transform:none">(good ≤50)</span></th><th>PM2.5 <span style="text-transform:none">(WHO ≤15)</span></th><th>O₃ / NO₂</th><th>UV</th><th>Altitude</th><th>Flags</th></tr></thead><tbody>
   ${rows.map(({ s, d, e }) => `<tr><td class="mono">${fd(d)}</td><td>${H.esc(s.city)}</td><td class="mono">${e.tMin} – ${e.tMax}</td><td class="mono">${e.heatIndex}</td><td class="mono">${e.hum}%</td><td><span class="badge ${H.aqiCat(e.aqi)[1]}">${e.aqi}</span></td><td class="mono">${e.pm25}</td><td class="mono">${e.o3} / ${e.no2}</td><td class="mono">${e.uv}</td><td class="mono">${(s.alt || e.alt || 0).toLocaleString()} m</td><td>${e.hazards.map(h => `<span class="badge caution">${h}</span>`).join(' ')}</td></tr>`).join('')}</tbody></table>${H.c.syn('All environmental values on this page are synthetic')}${H.c.src(['airnow', 'yb'])}</div></div>
   <div class="grid g3 section"><div class="card"><h3>Sleep</h3>${sl.length ? sl.map(l => `<div class="row between small"><span>${fd(l.date)}</span><b class="mono">${l.hours} h · ${l.quality}</b></div>`).join('') : '<p class="small muted">No sleep logged.</p>'}<button class="btn sm ghost" data-act="log-sleep" style="padding-left:0">Log sleep</button></div>
    <div class="card"><h3>Hydration</h3><p class="small muted">Goal ${(+S.lifestyle.hydration / 1000).toFixed(1)} L/day — raise it in heat, at altitude and on flight days.</p><button class="btn sm sec" data-act="water" data-ml="250">+250 ml</button> <button class="btn sm sec" data-act="water" data-ml="500">+500 ml</button></div>
    <div class="card"><h3>Altitude rules</h3><p class="small">${H.esc(H.ALT.text)}</p>${H.c.src([H.ALT.src])}</div></div>
   <div class="note warn section">HERMES never adjusts medicine doses because of temperature, pollution, hydration, activity or sleep. It reminds you of your clinician's action plan.</div>`;
};

/* ---------- circadian planner ---------- */
H.views.circadian = () => {
  const t = H.trip.focus(); if (!t || !H.trip.outbound(t)) return H.c.ph('Circadian planner', '', 'My Journey') + H.c.empty('No flight to plan around', 'Add a trip with a flight to build your adaptive sleep–wake plan.', '<a class="btn" href="#newtrip">Plan a trip</a>');
  const P = H.circ.plan(t); const L = H.state.lifestyle;
  const pct = m => (((m % 1440) + 1440) % 1440) / 1440 * 100;
  const seg = (a, b, cls, title) => { if (a == null || b == null) return ''; let out = ''; const A = ((a % 1440) + 1440) % 1440, B = ((b % 1440) + 1440) % 1440; const parts = B > A ? [[A, B]] : [[A, 1440], [0, B]]; parts.forEach(([x, y]) => out += `<span class="${cls}" style="left:${x / 14.4}%;width:${(y - x) / 14.4}%" title="${title}: ${H.fromMin(a)}–${H.fromMin(b)}"></span>`); return out; };
  const bar = d => `<div class="circ-row"><div class="d">${d.label}<small>${fd(d.date)} · ${H.tzShort(d.tz)}</small></div><div class="circ-bar">${d.flight ? `<span class="fl" style="left:${d.flight[0] / 14.4}%;width:${(d.flight[1] - d.flight[0]) / 14.4}%" title="Flight"></span>` : ''}${d.sleep ? seg(d.sleep[0], d.sleep[1], 'sl', 'Sleep') : ''}${d.lightSeek ? seg(d.lightSeek[0], d.lightSeek[1], 'li', 'Seek light') : ''}${d.lightAvoid ? seg(d.lightAvoid[0], d.lightAvoid[1], 'av', 'Avoid bright light') : ''}${(d.meals || []).map(m => `<span class="me" style="left:${pct(m)}%" title="Meal ${H.fromMin(m)}"></span>`).join('')}${d.caffeineCutoff != null ? `<span class="cf" style="left:${pct(d.caffeineCutoff)}%" title="No caffeine after ${H.fromMin(d.caffeineCutoff)}"></span>` : ''}</div></div>`;
  const debt = (P.recentDebt || 0) + P.flightDebt;
  return H.c.ph('Circadian adaptation', `Adaptive sleep–wake plan for ${H.esc(t.name)}. All body-clock figures are estimates — individual adaptation varies.`, 'My Journey', H.c.tripPicker(), ['journey', 'My Journey']) +
   `<div class="grid g4"><div class="card stat"><div class="k">Time difference</div><div class="v">${H.fmtDur(P.abs)}</div><div class="b">${P.east ? 'Eastward — usually harder (day is shortened)' : P.abs ? 'Westward' : 'None'}</div></div>
    <div class="card stat"><div class="k">Est. adaptation</div><div class="v">~${P.adaptDays}<small> days</small></div><div class="b">Estimate · ~${P.rate} h/day after arrival</div></div>
    <div class="card stat"><div class="k">Pre-flight shift</div><div class="v">${P.preDays ? P.preTotal + '<small> h</small>' : '—'}</div><div class="b">${P.preDays ? `over ${P.preDays} days before departure` : 'Not needed for this shift'}</div></div>
    <div class="card stat"><div class="k">Est. sleep deficit</div><div class="v">${H.round(debt, 1)}<small> h</small></div><div class="b">${P.recentDebt != null ? `recent nights avg ${H.round(P.avgSleep, 1)} h vs usual ${H.round(P.habitual, 1)} h` : 'log sleep to refine'}${P.flightDebt ? ' + overnight flight' : ''}</div></div></div>
   <div class="card section"><div class="card-head"><h3>Day-by-day plan</h3><div class="legend" style="margin:0"><span><i class="box" style="background:var(--deep)"></i>Sleep</span><span><i class="box" style="background:var(--amber)"></i>Seek daylight</span><span><i class="box" style="background:repeating-linear-gradient(135deg,#94A3B8 0 3px,transparent 3px 7px)"></i>Avoid bright light</span><span><i class="box" style="background:var(--blue)"></i>Flight</span><span><i class="box" style="background:var(--teal-ink);border-radius:50%"></i>Meal</span><span><i style="background:var(--coral);width:2px;height:12px"></i>Caffeine cut-off</span></div></div>
    <div class="circ-axis"><div></div><div><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div></div>${P.days.map(bar).join('')}
    <p class="small muted" style="margin-top:8px">Pre-departure and travel-day rows use ${H.tzShort(P.f.fromTz)} time; destination rows use ${H.tzShort(P.f.toTz)} local time.</p></div>
   <div class="grid g2 section">${P.days.map(d => `<div class="card"><div class="row between"><h3>${d.label}</h3><span class="small muted">${fd(d.date)} · ${H.tzShort(d.tz)}</span></div><ul style="padding-left:18px;margin:8px 0" class="small">${d.sleep ? `<li><b>Sleep</b> ${H.fromMin(d.sleep[0])} → <b>wake</b> ${H.fromMin(d.sleep[1])}</li>` : ''}${d.lightSeek ? `<li><b>Daylight / outdoor time</b> ${H.fromMin(d.lightSeek[0])}–${H.fromMin(d.lightSeek[1])} — a good window for a walk</li>` : ''}${d.lightAvoid ? `<li><b>Avoid bright light</b> ${H.fromMin(d.lightAvoid[0])}–${H.fromMin(d.lightAvoid[1])}</li>` : ''}${d.meals ? `<li><b>Meals</b> ${d.meals.map(H.fromMin).join(' · ')} (local mealtimes)</li>` : ''}${d.caffeineCutoff != null ? `<li><b>Caffeine</b> none after ${H.fromMin(d.caffeineCutoff)}</li>` : ''}${d.notes.map(n => `<li>${H.esc(n)}</li>`).join('')}</ul></div>`).join('')}</div>
   <div class="grid g2 section"><form class="card" data-form="sleepprofile"><h3>Your sleep profile</h3><div class="grid g3">${H.c.field('bed', 'Usual bedtime', L.bed, 'time')}${H.c.field('wake', 'Usual wake', L.wake, 'time')}${H.c.select('chrono', 'Chronotype', [['early', 'Early bird'], ['intermediate', 'In between'], ['late', 'Night owl']], L.chrono)}</div>${H.c.select('caffeine', 'Caffeine', [['none', 'None'], ['morning', 'Mornings'], ['all', 'Through the day']], L.caffeine)}<button class="btn sm">Update plan</button></form>
    <div class="card"><h3>Good to know</h3><ul class="small" style="padding-left:18px"><li>No plan can reset your body clock perfectly; light timing, sleep timing and meals help it shift.</li><li>${P.east ? 'Flying east, morning light at the destination helps; light in the late night/early morning before your body\'s low point can push the clock the wrong way.' : 'Flying west, evening light helps you stay up later.'}</li><li><b>Melatonin or sleeping medicines:</b> HERMES does not recommend these or their doses. Ask your clinician or pharmacist — especially with other medicines or chronic conditions.</li><li>Your time-critical medicine schedule is separate: see <a href="#meds">Medication</a>.</li></ul>${H.c.src(['yb'])}</div></div>`;
};
H.forms.sleepprofile = f => { Object.assign(H.state.lifestyle, { bed: f.bed, wake: f.wake, chrono: f.chrono, caffeine: f.caffeine }); H.save(); H.toast('Circadian plan updated'); H.render(); };

/* ---------- travel kit ---------- */
H.views.kit = () => {
  const t = H.trip.focus(); const kit = t ? H.mergeKit(t).filter(k => !k.removed) : H.genKit(null); const cats = [...new Set(kit.map(k => k.cat))];
  return H.c.ph('Travel health kit', t ? `Personalised for ${H.esc(t.name)} — destination, ${H.plural(H.trip.days(t), 'day')}, climate, altitude, your conditions, medicines and allergies.` : 'A general kit. Add a trip to personalise it.', 'My Journey', `${H.c.tripPicker()}${t ? `<button class="btn sec" data-act="add-kit">${H.icon('plus')}Add item</button><button class="btn sec" data-act="export-kit">${H.icon('download')}Save / print</button>` : ''}`, ['journey', 'My Journey']) +
   `<div class="note warn" style="margin-bottom:16px">Prescription medicines appear only if they are already prescribed to you. Anything marked "ask a clinician" needs a professional decision — HERMES does not recommend prescription medicines.</div>` +
   (t ? `<div class="card"><div class="row between small"><b>${kit.filter(k => k.done).length} of ${kit.length} packed</b></div><div class="meter"><i style="width:${kit.filter(k => k.done).length / Math.max(1, kit.length) * 100}%"></i></div></div>` : '') +
   `<div class="grid g2" style="margin-top:16px;align-items:start">${cats.map(c => `<div class="card"><h3>${c}</h3><ul class="list">${kit.filter(k => k.cat === c).map(k => `<li class="${k.done ? 'done' : ''}">${t ? `<input type="checkbox" ${k.done ? 'checked' : ''} data-act="kit-item" data-id="${k.id}" style="width:20px;height:20px;accent-color:var(--teal-ink)">` : ''}<div class="grow"><div class="t" style="font-weight:500">${H.esc(k.text)}</div>${k.why ? `<div class="s">${H.esc(k.why)}</div>` : ''}</div>${t ? `<button class="iconbtn" data-act="kit-del" data-id="${k.id}">${H.icon('trash')}</button>` : ''}</li>`).join('')}</ul></div>`).join('')}</div>`;
};
H.actions['kit-item'] = el => { const k = H.byId(H.trip.focus().kit, el.dataset.id); k.done = !k.done; H.save(); H.render(); };
H.actions['kit-del'] = el => { const t = H.trip.focus(); const k = H.byId(t.kit, el.dataset.id); if (k.auto) k.removed = true; else t.kit = t.kit.filter(x => x !== k); H.save(); H.render(); };
H.actions['add-kit'] = () => H.modal(`<div class="modal-head"><h2>Add kit item</h2><button class="iconbtn" data-act="close">${H.icon('x')}</button></div><form data-form="kit">${H.c.field('text', 'Item', '', 'text', 'required')}${H.c.field('cat', 'Category', 'My items')}<button class="btn">Add</button></form>`);
H.forms.kit = f => { H.trip.focus().kit.push({ id: H.uid('k'), cat: f.cat || 'My items', text: f.text, auto: false, done: false }); H.save(); H.closeModal(); H.render(); };
H.actions['export-kit'] = () => { const t = H.trip.focus(); const kit = t.kit.filter(k => !k.removed); const cats = [...new Set(kit.map(k => k.cat))];
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>HERMES travel kit — ${H.esc(t.name)}</title><style>body{font-family:Inter,Arial,sans-serif;color:#0B1D33;max-width:760px;margin:24px auto;padding:0 16px}h1{font-size:22px}h2{font-size:15px;margin-top:18px;border-bottom:1px solid #E2E8F0;padding-bottom:4px}li{list-style:none;margin:6px 0}li:before{content:"☐ ";font-size:16px}.m{color:#66758A;font-size:12px}</style></head><body><h1>Travel health kit — ${H.esc(t.name)}</h1><p class="m">Generated by HERMES ${new Date().toLocaleDateString()} · ${t.synthetic ? 'SYNTHETIC DEMO DATA · ' : ''}Print this page or save as PDF.</p>${cats.map(c => `<h2>${H.esc(c)}</h2><ul>${kit.filter(k => k.cat === c).map(k => `<li>${H.esc(k.text)}${k.why ? ` <span class="m">— ${H.esc(k.why)}</span>` : ''}</li>`).join('')}</ul>`).join('')}</body></html>`;
  H.download(`hermes-kit-${t.id}.html`, html, 'text/html'); };

/* ---------- healthcare finder ---------- */
H.dist = (a, b) => { const R = 6371, toR = x => x * Math.PI / 180; const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng); const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
H.views.care = () => {
  const ctx = H.context(); const t = ctx.trip; const S = H.state;
  const stop = ctx.stop || (t ? t.stops[0] : null); const city = H.param.careCity || (stop ? stop.city : ctx.city); const country = stop ? (t.stops.find(s => s.city === city) || stop).country : ctx.country;
  const origin = H.cityInfo(country, city); const need = H.param.need || 'appropriate';
  const needCaps = new Set(); if (H.has.diabetes()) needCaps.add('diabetes'); if (S.allergies.some(a => a.severity === 'severe')) needCaps.add('allergy'); if (H.has.cvd()) needCaps.add('cardiology'); if (t && H.trip.maxAlt(t) > 2500) needCaps.add('altitude');
  let fac = S.facilities.filter(f => f.city === city).map(f => Object.assign({}, f, { km: origin && f.lat ? H.dist(origin, f) : null }));
  fac.sort((a, b) => (a.km ?? 1e9) - (b.km ?? 1e9));
  const nearest = fac[0]; const emerg = fac.filter(f => f.caps.includes('emergency')).sort((a, b) => (a.km ?? 1e9) - (b.km ?? 1e9))[0];
  const appropriate = fac.filter(f => f.caps.includes('emergency') && [...needCaps].every(c => f.caps.includes(c) || c === 'altitude')).sort((a, b) => (a.km ?? 1e9) - (b.km ?? 1e9))[0] || emerg;
  if (need === 'emergency') fac = fac.filter(f => f.caps.includes('emergency')); if (need === 'pharmacy') fac = fac.filter(f => f.type === 'Pharmacy'); if (need === 'clinic') fac = fac.filter(f => /Clinic|post/i.test(f.type));
  const q = s => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s);
  const cities = t ? [...new Set(t.stops.map(s => s.city))] : [city];
  const c = H.COUNTRIES[country];
  return H.c.ph('Healthcare finder', 'Find care at your destination. HERMES never invents facilities, hours or emergency capability.', 'My Journey', `<select class="in" style="width:auto" data-change="care-city">${cities.map(x => `<option ${x === city ? 'selected' : ''}>${H.esc(x)}</option>`).join('')}</select><button class="btn sec" data-act="add-fac">${H.icon('plus')}Add facility</button>`, ['journey', 'My Journey']) +
   `<div class="grid g3"><div class="card"><h3>Search live maps</h3><p class="small muted">Opens Google Maps outside HERMES with real, current listings.</p><div class="stack" style="margin-top:8px">${[['Emergency hospital', 'emergency hospital near ' + city], ['Hospital', 'hospital near ' + city], ['Pharmacy', 'pharmacy near ' + city], ['English-speaking clinic', 'English speaking clinic ' + city]].map(([l, s]) => `<a class="tile-link" href="${q(s)}" target="_blank" rel="noopener">${H.icon('pin')}<span>${l}<small>${H.esc(city)}</small></span></a>`).join('')}</div></div>
    <div class="card"><h3>Official directories</h3>${country === 'Japan' ? `<a class="tile-link" href="${H.SOURCES.jnto_med.url}" target="_blank" rel="noopener">${H.icon('globe')}<span>JNTO medical institutions for visitors<small>Search English-capable hospitals</small></span></a><a class="tile-link" href="${H.SOURCES.jnto_hotline.url}" target="_blank" rel="noopener" style="margin-top:8px">${H.icon('phone')}<span>Japan Visitor Hotline · 050-3816-2787<small>24/7 · English/Chinese/Korean</small></span></a>` : `<p class="small">Check your travel insurer's network and your embassy's list of local doctors.</p>`}${S.passport.insurance.phone ? `<div class="sep"></div><div class="small"><b>Your insurer assistance:</b> ${H.esc(S.passport.insurance.provider)} · <span class="mono">${H.esc(S.passport.insurance.phone)}</span></div>` : ''}</div>
    <div class="card"><h3>Nearest vs appropriate</h3><div class="why" style="margin:0"><dl style="grid-template-columns:110px 1fr"><dt>Nearest</dt><dd>${nearest ? H.esc(nearest.name) + (nearest.km != null ? ` · ${H.round(nearest.km)} km` : '') : '—'}</dd><dt>Emergency</dt><dd>${emerg ? H.esc(emerg.name) : 'None saved — use live maps or call ' + (c ? c.emergency[0].num : 'local emergency')}</dd><dt>Appropriate</dt><dd>${appropriate ? H.esc(appropriate.name) : '—'}${needCaps.size ? `<div class="small muted">for: ${[...needCaps].join(', ')}</div>` : ''}</dd></dl></div></div></div>
   <div class="section"><div class="row between" style="margin-bottom:10px"><h2>Facilities in ${H.esc(city)}</h2><div class="seg">${[['appropriate', 'All'], ['emergency', 'Emergency'], ['clinic', 'Clinics'], ['pharmacy', 'Pharmacies']].map(([k, l]) => `<button class="${need === k ? 'on' : ''}" data-act="care-need" data-k="${k}">${l}</button>`).join('')}</div></div>
   ${fac.length ? `<div class="grid g2">${fac.map(f => `<div class="card"><div class="row between"><div><h3>${H.esc(f.name)}</h3><div class="small muted">${H.esc(f.type)} · ${f.km != null ? H.round(f.km) + ' km from ' + H.esc(city) + ' centre' : 'distance unknown'}</div></div>${f.source === 'demo' ? '<span class="badge demo">Fictional demo</span>' : '<span class="badge ok">Saved by you</span>'}</div>
     <div class="row" style="margin:10px 0;gap:6px">${f === nearest || (nearest && f.id === nearest.id) ? '<span class="badge info">Nearest</span>' : ''}${emerg && f.id === emerg.id ? '<span class="badge urgent">Emergency department</span>' : ''}${appropriate && f.id === appropriate.id ? '<span class="badge ok">Appropriate for your needs</span>' : ''}${f.caps.map(x => `<span class="badge">${x}</span>`).join('')}</div>
     <div class="small">${H.esc(f.address || '')}<br>Hours: ${H.esc(f.hours || 'not verified')} · Languages: ${H.esc((f.langs || []).join(', ') || 'unknown')}<br>Phone: <span class="mono">${H.esc(f.phone || '—')}</span></div>
     <div class="row" style="margin-top:10px">${f.source !== 'demo' && f.phone ? `<a class="btn sm" href="tel:${H.esc(f.phone.replace(/[^0-9+]/g, ''))}">${H.icon('phone')}Call</a>` : ''}<a class="btn sm sec" href="${f.lat ? 'https://www.google.com/maps/dir/?api=1&destination=' + f.lat + ',' + f.lng : q(f.name + ' ' + f.city)}" target="_blank" rel="noopener">${H.icon('pin')}Navigate</a><button class="btn sm sec" data-act="fac-save" data-id="${f.id}">${f.saved ? 'Saved ✓' : 'Save'}</button><button class="btn sm ghost" data-act="fac-share" data-id="${f.id}">${H.icon('share')}Share</button>${t ? `<button class="btn sm ghost" data-act="fac-trip" data-id="${f.id}">Add to trip</button>` : ''}</div></div>`).join('')}</div>` : H.c.empty('No facilities saved here', 'Use live maps or an official directory, then add the facility you choose so it is available offline.', `<button class="btn" data-act="add-fac">Add facility</button>`)}
   ${fac.some(f => f.source === 'demo') ? `<p class="small muted" style="margin-top:10px">Facilities marked "Fictional demo" do not exist; they show how HERMES ranks nearest, emergency and appropriate care. Use the live search or official directories for real care.</p>` : ''}</div>`;
};
H.change['care-city'] = el => { H.param.careCity = el.value; H.render(); };
H.actions['care-need'] = el => { H.param.need = el.dataset.k; H.render(); };
H.actions['fac-save'] = el => { const f = H.byId(H.state.facilities, el.dataset.id); f.saved = !f.saved; H.save(); H.render(); };
H.actions['fac-share'] = el => { const f = H.byId(H.state.facilities, el.dataset.id); H.copy(`${f.name}${f.source === 'demo' ? ' (fictional demo)' : ''} — ${f.address} — ${f.lat ? 'https://www.google.com/maps/search/?api=1&query=' + f.lat + ',' + f.lng : ''}`); };
H.actions['fac-trip'] = el => { const f = H.byId(H.state.facilities, el.dataset.id); const t = H.trip.focus(); t.checklist.push({ id: H.uid('k'), key: H.uid('k'), text: `Saved facility: ${f.name}`, cat: 'Healthcare', due: null, auto: false, done: true }); f.saved = true; H.save(); H.toast('Added to your trip checklist'); H.render(); };
